name: verify

# 每次 push / PR 都跑：语法、任务表、离线自测、打包清单
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖（只需要 openpyxl，用于核对任务表）
        run: python -m pip install --upgrade pip openpyxl

      - name: 一键回归（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          chmod +x verify.sh
          ./verify.sh

      - name: 一键回归（Windows）
        if: runner.os == 'Windows'
        run: python verify.py

      - name: 上传打包清单（排障用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-manifest-${{ matrix.os }}
          path: dist/打包清单.txt
          if-no-files-found: ignore
