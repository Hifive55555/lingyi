<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵弈小窗</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; scrollbar-color: #3a424c #111418; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #14181d; color: #dfe6ee; font: 12px "Microsoft YaHei", sans-serif; }
body { display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 8px; background: #111418; }
::-webkit-scrollbar-thumb { background: #2c333b; border-radius: 4px; }
.sub { color: #8b97a5; } .ok { color: #4cd07d; } .bad { color: #f0485a; } .grow { flex: 1; }
button { background: #262c33; color: #dfe6ee; border: 1px solid #3a424c; border-radius: 3px; padding: 2px 6px; cursor: pointer; font: inherit; white-space: nowrap; }
button:hover { background: #313942; border-color: #e8833a; }
button:focus { outline: none; }
input { background: #0f1215; color: #dfe6ee; border: 1px solid #3a424c; border-radius: 3px; padding: 2px 6px; font: inherit; min-width: 0; }
input:focus { outline: none; border-color: #3fd0e6; }

.top { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding: 3px 6px; background: #1b2026; border-bottom: 1px solid #2c333b; white-space: nowrap; }
#brand { font-weight: bold; color: #3fd0e6; }
#clock { font: 12px Consolas, monospace; color: #3fd0e6; }
.tab.on { background: #1d3640; border-color: #3fd0e6; color: #3fd0e6; }
.tab kbd { margin-left: 3px; color: #8b97a5; font: 10px Consolas, monospace; }

.sec { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.sb { flex: 0 0 auto; display: flex; gap: 3px; align-items: center; padding: 3px 5px; background: #161a1f; border-bottom: 1px solid #262c33; }
.sb .cats { display: flex; gap: 3px; flex: 0 0 auto; }
.sb input { flex: 1; }
.sb:empty { display: none; }
.cat i { font-style: normal; color: #8b97a5; margin-left: 3px; font-size: 11px; }
.cat.on { background: #1d3640; border-color: #3fd0e6; color: #3fd0e6; }
.tiles { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 2px 4px; }
.gr { display: flex; align-items: flex-start; gap: 4px; padding: 1px 0; border-bottom: 1px solid #1e242a; }
.gr .ts { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px; max-height: 42px; overflow-y: auto; }
.t, .g { display: inline-flex; align-items: baseline; gap: 2px; padding: 0 4px; border-radius: 2px; cursor: pointer; user-select: none; white-space: nowrap; line-height: 18px; }
.t { background: #232a31; border: 1px solid #313942; border-left: 3px solid #4a5560; }
.t:hover { border-color: #e8833a; }
.t em { font-style: normal; font-size: 10px; color: #d0a060; margin-left: 2px; }
#enemy .t em { color: #8b97a5; } #enemy .t.rch em { color: #4cd07d; }
.t.on { background: #2f4a1f; border-color: #8fd14f; opacity: 1; }
.t.park:not(.on) { opacity: .5; }
.t.f1 { border-left-color: #4cd07d; } .t.f2 { border-left-color: #e0c040; } .t.f3 { border-left-color: #f0485a; }
.t.hurt { background: #3a2226; }
.t.rch { border-left-color: #4cd07d; } .t.rch em { color: #4cd07d; }
.t.tg { background: #5a2a18; border-color: #e8833a; }
.t.ch { border-color: #e8833a; border-style: dashed; }
.g { flex: 0 0 96px; overflow: hidden; text-overflow: ellipsis; display: block; color: #3fd0e6; font-size: 11px; padding-left: 3px; border-left: 2px solid #3fd0e6; }
.g i { font-style: normal; color: #8b97a5; margin-left: 2px; }
.g u { text-decoration: none; font-weight: bold; color: #e0c040; margin-right: 3px; }
.g.on { color: #8fd14f; border-left-color: #8fd14f; }
.empty { color: #8b97a5; padding: 2px; }

#selbar { flex: 0 0 auto; display: flex; gap: 3px; align-items: center; padding: 2px 6px; border-top: 1px solid #2c333b; border-bottom: 2px solid #2c333b; min-height: 24px; overflow: hidden; white-space: nowrap; }
#selbar .chip { background: #23303a; border-radius: 2px; padding: 0 4px; }
#wp { flex: 0 0 auto; max-height: 45%; overflow-y: auto; padding: 3px 6px; border-top: 2px solid #2c333b; background: #101317; }
#wp:empty, #thr:empty { display: none; }
#thr { flex: 0 0 auto; padding: 4px 6px; }
body.thr #enemySec { display: none; }
body.weapon #thr { display: none; }
#msg { flex: 0 0 auto; height: 47px; overflow: hidden; padding: 1px 6px; background: #111418; border-top: 1px solid #2c333b; font-size: 11px; line-height: 15px; }

.pt { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
td, th { padding: 1px 3px; border-bottom: 1px solid #262c33; text-align: left; font-weight: normal; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
th { color: #8b97a5; font-size: 11px; }
tr.cant td { color: #7a8591; }
tr.far td { color: #e0a060; }
.q { display: inline-flex; align-items: center; gap: 1px; }
.q .qi { width: 34px; padding: 0 2px; text-align: center; font: 13px Consolas, monospace; }
.q button { padding: 0 5px; }
button.fire { background: #5a2a18; border-color: #e8833a; font-weight: bold; padding: 3px 14px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 2px 0 6px; }
.grid button { padding: 5px 2px; }
.hd { color: #8b97a5; margin: 2px 0; }

/* 防空值班：第三大标题，下面两个小标题（地空导弹营系统 / 雷达系统） */
#samPanel { display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 4px 6px; }
body.sam #samPanel { display: block; }
body.sam #mineSec, body.sam #selbar, body.sam #enemySec, body.sam #thr { display: none; }
.samh { color: #3fd0e6; font-weight: bold; margin: 6px 0 2px; padding-bottom: 1px; border-bottom: 1px solid #2c333b; }
.samh i { font-style: normal; color: #8b97a5; font-weight: normal; margin-left: 4px; font-size: 11px; }
.samrow { display: flex; align-items: center; gap: 5px; padding: 2px 0; border-bottom: 1px solid #1e242a; }
.samrow .sn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.samrow .sy { flex: 0 0 auto; color: #8b97a5; font-size: 10px; }
.samrow button { flex: 0 0 auto; min-width: 92px; text-align: center; }
.samrow button.strike { background: #5a2a18; border-color: #e8833a; color: #ffd0a0; font-weight: bold; }
.samrow button.bait { background: #1d3640; border-color: #3fd0e6; color: #9fe8f5; font-weight: bold; }
.samrow button.maneuver { background: #262c33; }
.samrow button:hover { border-color: #e8833a; }
</style>
</head>
<body class="weapon">
<div class="top"><span id="brand">◎</span><span id="clock">--:--:--</span>
  <button class="tab" data-t="weapon">武器<kbd id="kw">Alt+Q</kbd></button><button class="tab" data-t="thralt">油门高度<kbd id="kt">Alt+W</kbd></button><button class="tab" data-t="sam">防空值班<kbd id="ks">Alt+E</kbd></button>
  <span class="grow"></span><span id="conn" class="bad">●</span></div>
<div class="sec" id="mineSec">
  <div class="sb"><span class="cats" id="mCats"></span><input id="mQ" placeholder="搜我方" autocomplete="off"></div>
  <div class="sb" id="mRegs"></div>
  <div id="mine" class="tiles"></div>
</div>
<div id="selbar"></div>
<div class="sec" id="enemySec">
  <div class="sb"><span class="cats" id="eCats"></span><input id="eQ" placeholder="搜敌方" autocomplete="off"></div>
  <div id="enemy" class="tiles"></div>
  <div id="wp"></div>
</div>
<div id="thr"></div>
<div id="samPanel"></div>
<div id="msg"></div>
<script src="/web/overlay.js"></script>
</body>
</html>
