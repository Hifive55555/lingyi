<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>监控小窗</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; scrollbar-color: #3a424c #111418; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #14181d; color: #dfe6ee;
             font: 12px "Microsoft YaHei", sans-serif; }
body { display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 8px; background: #111418; }
::-webkit-scrollbar-thumb { background: #2c333b; border-radius: 4px; }
.sub { color: #8b97a5; } .grow { flex: 1; }
.ok { color: #4cd07d; } .bad { color: #f0485a; } .warn { color: #e0c040; }

.top { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 3px 6px;
       background: #1b2026; border-bottom: 1px solid #2c333b; white-space: nowrap; }
#brand { font-weight: bold; color: #ff6070; }
#clock { font: 12px Consolas, monospace; color: #3fd0e6; }
#stat b { color: #f0485a; } #stat i { font-style: normal; color: #8b97a5; }

.bar { flex: 0 0 auto; display: flex; gap: 4px; align-items: center; padding: 3px 6px;
       background: #161a1f; border-bottom: 1px solid #262c33; }
button { background: #262c33; color: #dfe6ee; border: 1px solid #3a424c; border-radius: 3px;
         padding: 1px 6px; cursor: pointer; font: inherit; white-space: nowrap; }
button.on { background: #2f1a1e; border-color: #f0485a; color: #ff8090; }
input { background: #0f1215; color: #dfe6ee; border: 1px solid #3a424c; border-radius: 3px;
        padding: 1px 6px; font: inherit; min-width: 0; flex: 1; }
input:focus { outline: none; border-color: #3fd0e6; }

#list { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 0 6px; }
.sec { }
.hd { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; align-items: center;
      padding: 3px 6px; background: #1b2026; border-top: 1px solid #2c333b;
      border-bottom: 1px solid #2c333b; cursor: pointer; user-select: none; }
.hd .nm { font-weight: bold; color: #3fd0e6; }
.hd .ct { font-style: normal; color: #8b97a5; }
.hd .ct b { color: #f0485a; }
.hd.fold ~ .bd { display: none; }
.bd .empty { color: #6b7683; padding: 2px 10px; }

.row { display: flex; gap: 5px; align-items: baseline; padding: 1px 6px;
       border-bottom: 1px solid #1e242a; }
.row.safe { opacity: .45; }
.row .u { flex: 0 0 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .u u { text-decoration: none; color: #8b97a5; font-size: 10px; margin-left: 3px; }
.row .u u.dmg { color: #f0485a; }
.hit { background: #221a1c; }
.ms { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; min-width: 0; }
.mc { display: inline-flex; align-items: baseline; gap: 4px; padding: 0 5px; line-height: 17px;
      border: 1px solid #3a424c; border-left: 3px solid #e0c040; border-radius: 2px;
      background: #232a31; white-space: nowrap; }
.mc .mn { max-width: 132px; overflow: hidden; text-overflow: ellipsis; }
.mc .sp { font: 11px Consolas, monospace; color: #ffb454; }
.mc .dd { font: 10px Consolas, monospace; color: #8b97a5; }
.mc .tg { font: 11px Consolas, monospace; color: #e0c040; }
.mc.t1 { border-left-color: #f0485a; background: #2f1a1e; }
.mc.t1 .tg { color: #ff6070; }
.mc.t2 { border-left-color: #e8833a; } .mc.t2 .tg { color: #e8833a; }
.mc.t3 { border-left-color: #e0c040; }
.mc.t0 { border-left-color: #6b7683; } .mc.t0 .tg { color: #6b7683; }
#msg { flex: 0 0 auto; height: 26px; overflow: hidden; padding: 2px 6px; background: #111418;
       border-top: 1px solid #2c333b; font-size: 11px; color: #8b97a5; }
</style>
</head>
<body>
<div class="top">
  <span id="brand">◎ 监控</span><span id="clock">--:--:--</span>
  <span id="stat">被攻击 <b>0</b> <i>/ 0</i></span>
  <span class="sub" id="mstat">敌方弹药 0</span>
  <span class="grow"></span><span id="conn" class="bad">● 无对局</span>
</div>
<div class="bar">
  <button id="onlyHit" class="on">只看被攻击</button>
  <button id="bySpeed">按弹速排</button>
  <input id="q" placeholder="搜单元（苏35 / #1）" autocomplete="off">
</div>
<div id="list"></div>
<div id="msg">本智能体只做监控，不下发任何指令。判定：弹在朝我飞就算（不设距离 / 时间门限）</div>
<script src="/web/monitor.js"></script>
</body>
</html>
