// ====================== 消息定义部分 ======================

// 空参数
message RequestEmpty {}

// 注册请求
message RequestExecuteRegister {
  int32 rid = 1;//服务器分配的ID，客户端首次注册时不需填写(断线重连或心跳需要填写首次注册分配的ID，如果使用我方提供的SDK内部有集成重连与心跳机制)
  bool exit = 2;//是否退出注册（终端关闭时调用设置true） true-退出  false-注册
  string side = 3;//推演方名称
  string aiagent = 4;//智能体标识
  string username = 5;//用户名或标识
  int32 cmdsrc = 6;//指令来源  0手操指令、1智能体指令
  int32 runmode = 7;//运行模式 0-普通模式  1-大样本模式     2-智能体训练模式  3-自由模式_人机对战  4-自由模式_人人对战  5-沙场对决_人机对战  6-沙场对决_人人对战  7-新手引导模式  8-自由训练模式  9-想定工坊模式
}

// 注册响应
message ReplyExecuteRegister {
  int32 code = 1;//0-成功   非0-失败
  string message = 2;//消息
  string version = 3;//版本号
  int32 rid = 4;//返回注册ID
}

// 通用响应
message Reply {
  int32 code = 1;//0-成功   非0-失败
  bytes result = 2;//二进制内容（成功：结果值  失败：失败原因）
}

message ExecuteBatchPara{
  string function = 1;//函数名，例：executeRegister
  bytes para = 2;//参数二进制序列化数据
}

message RequestExecuteBatch{
  bool jumpError = 1;//true:遇错继续执行 false:遇错中断，已执行语句不回滚
  repeated ExecuteBatchPara batchPara = 2;
}

// 批量执行响应
message ReplyExecuteBatch {
  repeated Reply reply = 1;
}

message RequestExecuteLua {
  string script=1;//lua脚本
}

// ====================== 基础数据结构 ======================

// 地理坐标
message GeoPosition {
  double longitude = 1;//经度（-180，180）
  double latitude = 2;//纬度（-90，90）
  optional double altitude = 3;//高度（可选）
}

// 路径点
message Waypoint {
  GeoPosition position = 1;//位置
  optional double speed = 2;//速度（可选）
  optional double altitude = 3;//高度（可选）
  optional string name = 4;//名称（可选）
}

// 单元基础信息
message BaseUnitInfo {
  string guid = 1;//单元GUID
  optional string side = 2;//推演方（可选）
  optional string name = 3;//名称（可选）
}

// 任务基础信息
message BaseMissionInfo {
  string side = 1;//推演方
  string missionName = 2;//任务名
  optional string missionGuid = 3;//任务GUID（可选）
  optional string missionType = 4;//任务类型（可选）
}

// ====================== 通用请求消息 ======================

// 简单请求（用于大多数查询接口）
message SimpleRequest {
  int32 rid = 1;//注册ID
  int32 type = 2;//类型
  string para = 3;//参数
  string remark = 4;//备注
}

// 删除请求
message RequestDelete {
  repeated string guids = 1;//GUID数组
}

// 重命名请求
message RequestRename {
  string guid = 1;//GUID
  string name = 2;//新名称
}

// 获取信息请求
message RequestGet {
  string guid = 1;//GUID
}
message RequestMissionDelete{
  string side = 1;
  string missionid = 2;//删除任务ID
}

message RequestMissionRename{
  string side = 1;
  string missionid = 2;
  string newname = 3;
}

// ====================== 想定管理消息 ======================

// 新建想定请求
message RequestNewScenario {
  string scenName = 1;//想定名称
}

// 加载想定请求
message RequestLoadScenario {
  string scenName = 1;//想定名称
  int32 loadScheme = 2;//加载方案
}

// 保存想定请求
message RequestSaveScenario {
  string scenName = 1;//想定名称
  string scenContent = 2;//想定内容
}

// 设置想定信息请求
message RequestSetScenarioInfo {
  optional string currentTime = 1;//当前时间 exp:"2020-05-01 12:11:02"
  optional string startTime = 2;//开始时间 exp:"2020-05-01 12:11:02"
  optional int64 duration = 3;//持续时间 单位：秒
  optional int32 complexity = 4;//复杂度
  optional int32 difficulty = 5;//难度
  optional string location = 6;//位置
  optional string featureOption = 7;//场景功能和真实感受  [DetailedGunFireControl|UnlimitedBaseMags|RealisticSubComms]，不填写的认为false
  optional string title = 8;//标题
  optional string description = 9;//描述 base64编码
  optional string postureColor = 10;//想定各推演方颜色
}

message RequestGetScenarioInfo {
}

message MIFileInfo {
  string name = 1;//想定名称(不带扩展名，例:TEST)
  string path = 2;//想定路径(相对路径，例:比赛想定/TEST.scen)
}

message MIFileList {
  repeated MIFileInfo fileinfos = 1;
}

message RequestGetScenarioList {
}


// 获取想定基本信息请求
message RequestGetScenarioBasicInfo {
  string scenName = 1;//想定名称
}

message RequestGetScenarioContent {
  string scenName = 1;//想定名称
}

// ====================== 推演控制消息 ======================

// 设置推演状态
message RequestSetSimulationStatus {
  string status = 1;//"RUN":运行  "PAUSE":暂停  "END":终止
  int32 duration = 2;//运行时长（单位：秒）
}

// 设置推演速度请求
message RequestSetSimulationSpeed {
  int32 speed = 1;//倍速（参考ETimeCompression定义）
}

// ====================== 推演方管理消息 ======================

// 添加推演方请求
message RequestAddSide {
  string guid = 1;//GUID（客户端有传入ID则使用传入的，未传入则由引擎生成ID）
  string name = 2;//名称
}

// 移除推演方请求
message RequestRemoveSide {
  SimpleRequest request = 1;
}

// 推演方列表
message MISideList {
  map<string, string> infos = 1;//推演方信息（key-GUID  value-名称）
}

// 获取推演方列表
message RequestGetSideList {
  string scenName = 1;//想定名称（空：获取当前想定内的推演方列表）
}

// 设置阵营立场请求
message RequestSetSidePosture {
  string sideA = 1;//推演方A
  string sideB = 2;//推演方B
  string posture = 3;//立场。"F":友好,"H":敌对,"N":中立,"U":非友
}

// 获取阵营立场请求
message RequestGetSidePosture {
  string sideA = 1;//推演方A
  string sideB = 2;//推演方B
}

// 设置推演方选项请求
message RequestSetSideOptions {
  string side = 1;//推演方
  optional string awareness = 2;//认知水平  BLIND-一无所知，NORMAL普通水平，AUTOSIDE-知其属方，AUTOUNIT-知其属方与单元,OMNI-无所不知
