syntax = "proto3";

// version 3.0 - 2026.05.08
// 小驼峰命名法
// 命名规范：统一使用"动作 + 实体 + [描述]"模式
// 请求消息命名：Request + 接口名（首字母大写）

package SimServer;
//import "ServerEnum.proto";
//import "ServerSituation.proto";

service SimRpc {
	
    //************************************* 批量执行 *************************************
    rpc executeBatch(RequestExecuteBatch) returns (ReplyExecuteBatch);//统一批量执行接口
	
    //************************************* 全LUA指令接口 *************************************
    rpc executeLua(RequestExecuteLua) returns (Reply);//下达干预指令-lua接口
    
    //************************************* 单指令接口 *************************************
    // ====================== 通用接口 ======================
    rpc requestSendCurrentFullSituation(RequestEmpty) returns (Reply);//请求推送当前时间完整帧态势（返回值：指令执行状态）
    rpc getInitSituation(RequestEmpty) returns (stream Reply);//获取想定初始帧态势（返回值：Reply.result内容区为Struct.proto里面的THSituationFull二进制序列化数据）

    // ====================== 想定管理 ======================
    rpc newScenario(RequestNewScenario) returns (Reply);//新建想定（返回值：Reply.result内容区为想定GUID）
    rpc loadScenario(RequestLoadScenario) returns (Reply);//加载想定（返回值：指令执行状态）
    rpc saveScenario(RequestSaveScenario) returns (Reply);//保存想定（返回值：指令执行状态）
    rpc getScenarioContent(RequestGetScenarioContent) returns (Reply);//获取想定压缩部分解出的XML内容（返回值：Reply.result内容区为XML内容）
    
    rpc setScenarioInfo(RequestSetScenarioInfo) returns (Reply);//设置想定信息（返回值：指令执行状态）
    rpc getScenarioInfo(RequestGetScenarioInfo) returns (Reply);//获取想定信息（返回值：Reply.result内容区为RequestSetScenarioInfo对应的json序列化数据）
    rpc getScenarioBasicInfo(RequestGetScenarioBasicInfo) returns (Reply);//获取想定基础信息，想定文件的外层未压缩数据（返回值：Struct.proto里面的THScenarioInfo对应的json序列化数据）
    rpc getScenarioList(RequestGetScenarioList) returns (Reply);//获取想定列表（返回值：Reply.result内容区为MIFileList对应的json序列化数据）
    
    // ====================== 推演控制 ======================
    rpc setSimulationStatus(RequestSetSimulationStatus) returns (Reply);//运行推演（返回值：指令执行状态）
    rpc setSimulationSpeed(RequestSetSimulationSpeed) returns (Reply);//设置推演速度（返回值：指令执行状态）

    // ====================== 推演方管理 ======================
    rpc addSide(RequestAddSide) returns (Reply);//添加推演方（返回值：Reply.result内容区为推演方GUID）
    rpc deleteSide(RequestDelete) returns (Reply);//删除当前阵营（返回值：指令执行状态）
    rpc renameSide(RequestRename) returns (Reply);//重命名推演方（返回值：指令执行状态）
    rpc setSidePosture(RequestSetSidePosture) returns (Reply);//设置阵营立场（返回值：指令执行状态）
    rpc getSidePosture(RequestGetSidePosture) returns (Reply);//获取阵营立场（返回值：Reply.result内容区为立场["F":友好,"H":敌对,"N":中立,"U":非友]）
    
    rpc setSideOptions(RequestSetSideOptions) returns (Reply);//设置推演方选项（返回值：指令执行状态）
    rpc getSideOptions(RequestGetSideOptions) returns (Reply);//获取阵营选项得到阵营认知水平、训练水平等（返回值：Reply.result内容区为RequestSetSideOptions对应的json序列化数据）
    
    rpc setSideScore(RequestSetSideScore) returns (Reply);//设置推演方分数（返回值：指令执行状态）
    rpc getSideScore(RequestGetSideScore) returns (Reply);//获取推演方分数（返回值：Reply.result内容区为分数）
    rpc getSideUnitLoss(RequestGetSideUnitLoss) returns (Reply);//获取单元损耗信息/战损（返回值：Reply.result内容区为Struct.proto里面的THAARDetails二进制序列化数据）
 
    // ====================== 单元管理 ======================
    rpc addUnit(RequestAddUnit) returns (Reply);//添加单元（返回值：Reply.result内容区为单元GUID组，逗号分隔）
    rpc deleteUnit(RequestDelete) returns (Reply);//删除单元（返回值：指令执行状态）
    rpc renameUnit(RequestRename) returns (Reply);//单元重命名（返回值：指令执行状态）
    rpc killUnit(RequestKillUnit) returns (Reply);//灭掉一个单元（返回值：指令执行状态）
	
    rpc setUnitPosition(RequestSetUnitPosition) returns (Reply);//设置单元位置（返回值：指令执行状态）
    rpc setUnitHeading(RequestSetUnitHeading) returns (Reply);//设置单元航向（返回值：指令执行状态）
    rpc setUnitSpeed(RequestSetUnitSpeed) returns (Reply);//设置单元速度（返回值：指令执行状态）
    rpc setUnitHeight(RequestSetUnitHeight) returns (Reply);//设置高度\深度（数值）--立即移动到设置的高度  （返回值：指令执行状态）
    rpc setUnitDesiredHeight(RequestSetUnitDesiredHeight) returns (Reply);//设置期望高度\深度（数值）--根据当前速度移动到设置的高度 （返回值：指令执行状态）
    rpc setUnitPresetHeight(RequestSetUnitPresetHeight) returns (Reply);//设置预设高度\深度（等级：高空 中空 低空 等）--根据当前速度移动到设置的高度 （返回值：指令执行状态）
    rpc setUnitDesiredSpeed(RequestSetUnitDesiredSpeed) returns (Reply);//设置期望速度（数值） （返回值：指令执行状态）
    rpc setUnitPresetThrottle(RequestSetUnitPresetThrottle) returns (Reply);//设置预设油门（等级：低速 巡航 军用 等） （返回值：指令执行状态）
    rpc setUnitAutoDetectable(RequestSetUnitAutoDetectable) returns (Reply);//设置单元自动被探测到 （返回值：指令执行状态）
    rpc setUnitSide(RequestSetUnitSide) returns (Reply);//设置单元阵营 （返回值：指令执行状态）
    rpc setUnitDamage(RequestSetUnitDamage) returns (Reply);//设置单元毁伤 （返回值：指令执行状态）
    rpc setUnitFuel(RequestSetUnitFuel) returns (Reply);//单元油量设置 （返回值：指令执行状态）
    rpc setUnitReturnToBase(RequestSetUnitReturnToBase) returns (Reply);//返航 （返回值：指令执行状态）

    // ====================== 单元组件管理 ======================
    rpc addUnitMount(RequestAddUnitMount) returns (Reply);//添加挂架（返回值：Reply.result内容区为挂架GUID）
    rpc deleteUnitMount(RequestDeleteUnitMount) returns (Reply);//删除挂架（返回值：指令执行状态）
    rpc addUnitMagazine(RequestAddUnitMagazine) returns (Reply);//添加弹药库（返回值：Reply.result内容区为弹药库GUID）
    rpc deleteUnitMagazine(RequestDeleteUnitMagazine) returns (Reply);//删除弹药库（返回值：指令执行状态）
    rpc addUnitWeapon(RequestAddUnitWeapon) returns (Reply);//添加武器（返回值：指令执行状态）
    rpc deleteUnitWeapon(RequestDeleteUnitWeapon) returns (Reply);//删除武器（返回值：指令执行状态）
    rpc addUnitSensor(RequestAddUnitSensor) returns (Reply);//添加传感器（返回值：Reply.result内容区为传感器GUID）
    rpc deleteUnitSensor(RequestDeleteUnitSensor) returns (Reply);//删除传感器（返回值：指令执行状态）

    rpc getSideList(RequestGetSideList) returns (Reply);//获取推演方列表（返回值：Reply.result内容区为MISideList对应的json序列化数据）
	
    rpc setUnitTerrainFollow(RequestSetUnitTerrainFollow) returns (Reply);//设置飞机地形跟随（返回值：指令执行状态）
    rpc setUnitCourse(RequestSetUnitCourse) returns (Reply);//设置单元航线（返回值：指令执行状态）
	
    rpc refuelUnit(RequestRefuelUnit) returns (Reply);//实体补给，飞机加油等（返回值：指令执行状态）
    rpc assignUnitToMission(RequestAssignUnitToMission) returns (Reply);//分配单元到任务（返回值：指令执行状态）
    
    rpc setUnitSensorClassSwitch(RequestSetUnitSensorClassSwitch) returns (Reply);//传感器分类开关（返回值：指令执行状态）
    rpc setUnitSensorSwitch(RequestSetUnitSensorSwitch) returns (Reply);//传感器开关（返回值：指令执行状态）
    rpc setUnitEMCONAbide(RequestSetUnitEMCONAbide) returns (Reply);//实体是否遵循电磁管控条令（返回值：指令执行状态）
    rpc setUnitWeaponReloadPriority(RequestSetUnitWeaponReloadPriority) returns (Reply);//设置挂架上的武器优先重载（返回值：指令执行状态）
    rpc setUnitHoldPosition(RequestSetUnitHoldPosition) returns (Reply);//单元保持阵位（返回值：指令执行状态）
    rpc fillUnitMagazinesForLoadout(RequestFillUnitMagazinesForLoadout) returns (Reply);//用机载存量填充单元弹仓（返回值：指令执行状态）
	
    rpc getUnitWeaponDistributionInfo(RequestGetUnitWeaponDistributionInfo) returns (Reply);//获取单元挂载的武器分配信息（返回值：Reply.result内容区为MIUnitWeaponDistribution对应的json序列化数据）
    rpc calculateUnitFuelByAirTime(RequestCalculateUnitFuelByAirTime) returns (Reply);//飞机燃油计算，通过飞行时间（秒）计算剩余燃油（千克） （返回值：Reply.result内容区为剩余燃油（千克））

    // ====================== 编队管理 ======================
    rpc createGroup(RequestCreateGroup) returns (Reply);//创建编队（返回值：Reply.result内容区为编队GUID）
    rpc detachUnitFromGroup(RequestDetachUnitFromGroup) returns (Reply);//将实体分离出编队（返回值：指令执行状态）
    rpc addUnitToGroup(RequestAddUnitToGroup) returns (Reply);//单元添加到编队（返回值：指令执行状态）
    rpc setGroupLeader(RequestSetGroupLeader) returns (Reply);//设置编队领队（返回值：指令执行状态）
    rpc setGroupUnitBearing(RequestSetGroupUnitBearing) returns (Reply);//设置编组单元方位接口（返回值：指令执行状态）
    rpc setGroupFormation(RequestSetGroupFormation) returns (Reply);//设置编队阵型（返回值：指令执行状态）
    
    // ====================== 任务管理 ======================
    rpc addMission(RequestAddMission) returns (Reply);//添加任务（返回值：Reply.result内容区为任务GUID）
    rpc deleteMission(RequestMissionDelete) returns (Reply);//删除任务（返回值：指令执行状态）
    rpc renameMission(RequestMissionRename) returns (Reply);//任务名称修改（返回值：指令执行状态）
    rpc setMissionTime(RequestSetMissionTime) returns (Reply);//设置任务开始时间结束时间（返回值：指令执行状态）
    rpc setMissionStrikeMinimumTrigger(RequestSetMissionStrikeMinimumTrigger) returns (Reply);//设置任务打击最低情报立场请求[打击任务]（返回值：指令执行状态）
    rpc setMissionAircraftGroupSize(RequestSetMissionAircraftGroupSize) returns (Reply);//设置任务飞机编队规模[打击任务、巡逻任务、支援任务、转场任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionBoatGroupSize(RequestSetMissionBoatGroupSize) returns (Reply);//设置任务舰船编队规模[打击任务、巡逻任务、支援任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionStrikeFuelAmmo(RequestSetMissionStrikeFuelAmmo) returns (Reply);//设置打击任务燃油弹药规则[打击任务]（返回值：指令执行状态）
    rpc setMissionMinAircraftRequired(RequestSetMissionMinAircraftRequired) returns (Reply);//设置任务所需最少就绪飞机数[打击任务、巡逻任务、支援任务、转场任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionMaxAircraftAction(RequestSetMissionMaxAircraftAction) returns (Reply);//任务允许出动的最大飞机行动数[打击任务]（返回值：指令执行状态）
    rpc setMissionStrikeAircraftMinMaxRadius(RequestSetMissionStrikeAircraftMinMaxRadius) returns (Reply);//设置打击任务的最小最大打击半径[打击任务]（返回值：指令执行状态）
    rpc setMissionStrikeBoatMinMaxRadius(RequestSetMissionStrikeBoatMinMaxRadius) returns (Reply);//设置打击任务的最小最大打击半径[打击任务]（返回值：指令执行状态）
    rpc setMissionRadarUsageRule(RequestSetMissionRadarUsageRule) returns (Reply);//设置打击任务雷达运用规则[打击任务]（返回值：指令执行状态）
    rpc setMissionTankerConfig(RequestSetMissionTankerConfig) returns (Reply);//任务油轮配置[打击任务、巡逻任务、支援任务、转场任务、布雷任务、扫雷任务]（返回值：指令执行状态）

    rpc setMissionAircraftGroupSizeRequired(RequestSetMissionAircraftGroupSizeRequired) returns (Reply);//设置任务单元数低于编组规模数要求就不能启动[打击任务、巡逻任务、支援任务、转场任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionBoatGroupSizeRequired(RequestSetMissionBoatGroupSizeRequired) returns (Reply);//设置任务单元数低于编组规模数要求就不能启动[打击任务、巡逻任务、支援任务、转场任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionStrikeAutoPlanner(RequestSetMissionStrikeAutoPlanner) returns (Reply);//设置打击任务是否多扇面攻击,离轴攻击[打击任务]（返回值：指令执行状态）
    rpc setMissionStrikeOneTimeOnly(RequestSetMissionStrikeOneTimeOnly) returns (Reply);//设置打击任务是否仅限一次[打击任务]（返回值：指令执行状态）
    rpc setMissionIncludeInATO(RequestSetMissionIncludeInATO) returns (Reply);//任务是否包含在空中任务指令中[打击任务]（返回值：指令执行状态）
    rpc setMissionPreplanTargetsOnly(RequestSetMissionPreplanTargetsOnly) returns (Reply);//是否仅考虑计划目标（在目标清单）[打击任务]（返回值：指令执行状态）

    rpc setMissionEscortAircraftGroupSize(RequestSetMissionEscortAircraftGroupSize) returns (Reply);//设置任务护航单元编队规模[打击任务-护航]（返回值：指令执行状态）
    rpc setMissionEscortBoatGroupSize(RequestSetMissionEscortBoatGroupSize) returns (Reply);//设置任务护航单元编队规模[打击任务-护航]（返回值：指令执行状态）
    rpc setMissionEscortMinAircraftRequired(RequestSetMissionEscortMinAircraftRequired) returns (Reply);//设置任务所需最少就绪飞机数[打击任务-护航]（返回值：指令执行状态）
    rpc setMissionEscortMaxAircraftAction(RequestSetMissionEscortMaxAircraftAction) returns (Reply);//任务允许出动的最大飞机行动数[打击任务-护航]（返回值：指令执行状态）
    rpc setMissionEscortResponseRadius(RequestSetMissionEscortResponseRadius) returns (Reply);//护航最大威胁响应半径（返回值：指令执行状态）
    rpc setMissionEscortAircraftStoinvestigate(RequestSetMissionEscortAircraftStoinvestigate) returns (Reply);//设置任务侦查不明目标飞机数量请求（返回值：指令执行状态）
    rpc setMissionEscortAircraftStoengage(RequestSetMissionEscortAircraftStoengage) returns (Reply);//设置任务与敌方对抗的飞机数量请求（返回值：指令执行状态）
    rpc setMissionEscortWingmanEngageDistance(RequestSetMissionEscortWingmanEngageDistance) returns (Reply);//僚机可以在--范围内与敌交战请求（返回值：指令执行状态）
    rpc setMissionEscortAircraftGroupSizeRequired(RequestSetMissionAircraftGroupSizeRequired) returns (Reply);//设置护航任务飞机数低于编队规模要求不能起飞[护航任务]（返回值：指令执行状态）
    rpc setMissionEscortBoatGroupSizeRequired(RequestSetMissionBoatGroupSizeRequired) returns (Reply);//设置护航任务船舶数低于编队规模要求不能起飞[护航任务]（返回值：指令执行状态）
    rpc setMissionEscortBoatStoinvestigate(RequestSetMissionEscortBoatStoinvestigate) returns (Reply);//设置任务侦查不明目标舰船数量请求（返回值：指令执行状态）
    rpc setMissionEscortBoatStoengage(RequestSetMissionEscortBoatStoengage) returns (Reply);//设置任务与敌方对抗的舰船数量请求（返回值：指令执行状态）
    rpc setMissionEscortBoatEngageDistance(RequestSetMissionEscortBoatEngageDistance) returns (Reply);//设置任务舰船可以在--范围内与敌交战请求（返回值：指令执行状态）
	
    rpc setMissionPatrolZone(RequestSetMissionPatrolZone) returns (Reply);//设置任务巡逻区域请求（返回值：指令执行状态）
    rpc setMissionPatrolOnStation(RequestSetMissionPatrolOnStation) returns (Reply);//设置任务巡逻阵位上每类平台保持几个（返回值：指令执行状态）
    rpc setMissionPatrolOneThirdRule(RequestSetMissionPatrolOneThirdRule) returns (Reply);//设置任务巡逻三分之一规则时赋值[巡逻任务、支援任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionPatrolCheckOutsidePatrol(RequestSetMissionPatrolCheckOutsidePatrol) returns (Reply);//设置任务是否对巡逻区外的探测目标进行分析（返回值：指令执行状态）
    rpc setMissionPatrolCheckWeaponRange(RequestSetMissionPatrolCheckWeaponRange) returns (Reply);//设置任务是否对武器射程内探测目标进行分析（返回值：指令执行状态）
    rpc setMissionPatrolActiveEMCONInZone(RequestSetMissionPatrolActiveEMCONInZone) returns (Reply);//设置任务是否仅在巡逻/警戒区内打开电磁辐射[巡逻任务、支援任务]（返回值：指令执行状态）
    rpc setMissionPatrolProsecutionZone(RequestSetMissionPatrolProsecutionZone) returns (Reply);//区域按顺序排列的警戒参考点名 设置巡逻任务警戒区需要赋值（返回值：指令执行状态）
    rpc setMissionPatrolMovementStyle(RequestSetMissionPatrolMovementStyle) returns (Reply);//巡逻任务 动作风格设置（返回值：指令执行状态）

    rpc setMissionPatrolAircraftThrottle(RequestSetMissionPatrolAircraftThrottle) returns (Reply);//设置任务的出航油门、阵位油门[巡逻任务、支援任务、布雷任务、扫雷任务、投送任务]（返回值：指令执行状态）
    rpc setMissionPatrolAircraftTerrainFollowing(RequestSetMissionPatrolAircraftTerrainFollowing) returns (Reply);//飞机出航地形跟随、阵位地形跟随[巡逻任务、支援任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionPatrolSubmarineConfig(RequestSetMissionPatrolSubmarineConfig) returns (Reply);//潜艇出航油门、出航潜深、阵位潜深、阵位油门[巡逻任务、支援任务、布雷任务、扫雷任务]（返回值：指令执行状态）
    rpc setMissionPatrolShipThrottle(RequestSetMissionPatrolShipThrottle) returns (Reply);//水面舰艇出航油门、阵位油门[巡逻任务、支援任务、布雷任务、扫雷任务、投送任务]（返回值：指令执行状态）
    rpc setMissionPatrolAircraftAltitude(RequestSetMissionPatrolAircraftAltitude) returns (Reply);//设置任务的飞机出航高度 、阵位高度[巡逻任务、支援任务、布雷任务、扫雷任务、投送任务]（返回值：指令执行状态）
    rpc setMissionPatrolAircraftAttackConfig(RequestSetMissionPatrolAircraftAttackConfig) returns (Reply);//设置任务飞机的攻击信息[巡逻任务]（返回值：指令执行状态）
    rpc setMissionPatrolSubmarineAttackConfig(RequestSetMissionPatrolSubmarineAttackConfig) returns (Reply);//设置任务潜艇攻击油门的攻击信息[巡逻任务]（返回值：指令执行状态）
    rpc setMissionPatrolShipAttackConfig(RequestSetMissionPatrolShipAttackConfig) returns (Reply);//设置任务水面舰艇攻击信息[巡逻任务]（返回值：指令执行状态）
	
    rpc setMissionSupportOneTimeOnly(RequestSetMissionSupportOneTimeOnly) returns (Reply);//设置支援任务是否仅限一次（返回值：指令执行状态）
    rpc setMissionSupportLoopType(RequestSetMissionSupportLoopType) returns (Reply);//设置支援任务导航类型（返回值：指令执行状态）
	
    rpc setMissionFerryConfig(RequestSetMissionFerryConfig) returns (Reply);//转场规则 、飞机转场油门、飞机转场高度、转场地形跟随（返回值：指令执行状态）
    rpc setMissionFerryShipThrottle(RequestSetMissionFerryShipThrottle) returns (Reply);//转场任务水面舰艇航速转场油门（返回值：指令执行状态）
    rpc setMissionFerrySubThrottle(RequestSetMissionFerrySubThrottle) returns (Reply);//转场任务潜艇航速转场油门（返回值：指令执行状态）
    rpc setMissionFerrySubDepth(RequestSetMissionFerrySubDepth) returns (Reply);//转场任务潜艇潜深（返回值：指令执行状态）

    rpc setMissionMineArmingDelay(RequestSetMissionMineArmingDelay) returns (Reply);//布雷任务水雷解除保险延迟（返回值：指令执行状态）
    
    // ====================== 条令与电磁管控 ======================
    rpc setDoctrine(RequestSetDoctrine) returns (Reply);//设置条令（返回值：指令执行状态）
    rpc getDoctrine(RequestGetDoctrine) returns (Reply);//得到条令（返回值：Reply.result内容区为MIDoctrineSettings对应的json序列化数据）
    rpc setDoctrineWRA(RequestSetDoctrineWRA) returns (Reply);//设置武器使用规则（返回值：指令执行状态）
    rpc getDoctrineWRA(RequestGetDoctrineWRA) returns (Reply);//获取武器使用规则（返回值：Reply.result内容区为MIDoctrineWRAList对应的json序列化数据）
    rpc setEMCON(RequestSetEMCON) returns (Reply);//设置电磁管控（返回值：指令执行状态）

    // ====================== 航路点管理 ======================
    rpc setWaypoint(RequestSetWaypoint) returns (Reply);//航路点设置速度、高度（返回值：指令执行状态）
