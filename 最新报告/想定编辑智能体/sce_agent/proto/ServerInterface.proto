  optional int32 count=1;//货物数量 默认为1
  int32 cargoid=2;//货物DBID
}

// 更新单元的货物请求
message RequestUpdateUnitCargo{
  string guid = 1;//实体GUID
  repeated RequestAddUnitCargo ADD_CARGO=2;//添加货物信息
  repeated string REMOVE_CARGO=3;//移除货物信息  货物ID列表
