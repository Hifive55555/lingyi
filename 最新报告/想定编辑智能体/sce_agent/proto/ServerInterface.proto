// 任务配置（完整配置）
message MissionConfiguration {
  string type = 1;//任务类型
  optional string subType = 2;//子类型
  optional bool isActive = 3;//是否激活
  optional string startTime = 4;//开始时间
  optional string endTime = 5;//结束时间
  optional int32 flightSize = 6;//编队规模
  optional int32 minAircraft = 7;//最少飞机数
  optional int32 maxFlightBatches = 8;//最大飞行批次
  optional int32 strikeRadius = 9;//打击半径
  optional bool oneTimeOnly = 10;//是否仅限一次
  repeated string patrolZones = 11;//巡逻区域
  optional bool activeEMCON = 12;//激活电磁管控
  // ... 其他配置字段根据需要添加
}

// 添加任务请求
message RequestAddMission {
  string side = 1;//推演方
  string missionName = 2;//任务名
  optional string missionGuid = 3;//任务GUID（可选）
  string missionType = 4;//任务类型（"STRIKE"：打击任务、"PATROL"：巡逻任务、"SUPPORT"：支援任务、"CARGO"：货运任务、"MINING"：布雷任务、"MINECLEARING"：扫雷任务、"FERRY"：转场任务）
  optional string missionSubtype = 5;//任务子类型（打击任务-["SEA":对海、"AIR":对空、"ASW":反潜、"LAND":对陆]；巡逻任务-["ASW":反潜作战巡逻、"ASuW_Naval":反舰作战巡逻(海上)、"AAW":防空作战巡逻、"ASuW_Land":反舰作战巡逻(地面)、"ASuW_Mixed":反舰作战巡逻(混合)、"SEAD":防空压制巡逻、"SeaControl":海上控制巡逻]）
  bool isActive = 6;//是否激活
  optional string destinationGuid = 7;//目的地单元GUID（货运任务目的地、转场任务目的地）
  repeated string zonePoints = 8;//区域点集GUID（巡逻区域、支援航线、投送区域、布雷区域、扫雷区域）
  optional uint64 createTime = 9;// 任务创建时间戳
}

// 设置任务时间请求
message RequestSetMissionTime {
  string side = 1;//推演方
  string missionGuid = 2;//任务GUID
