}

// 触发器列表信息
message MIEventTrigger{
  repeated MIScenEndedEventTrigger scenEndedEventTriggers = 1;//想定结束触发器列表
  repeated MIUnitEntersAreaEventTrigger unitEntersAreaEventTriggers = 2;//单元进入区域触发器列表
