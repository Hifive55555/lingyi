  repeated MIUnitRemainsInAreaEventTrigger remainsInAreaEventTriggers = 6;//单元任在区域内触发器列表
  repeated MIRandomTimeEventTrigger randomTimeEventTriggers = 7;//随机时间触发器列表
  repeated MIRegularTimeEventTrigger regularTimeEventTriggers = 8;//固定时间触发器列表
  repeated MIScenLoadedEventTrigger scenLoadedEventTriggers = 9;//想定加载触发器列表
  repeated MIPointsEventTrigger pointsEventTriggers = 10;//分值触发器列表
  repeated MIUnitDamagedEventTrigger unitDamagedEventTriggers = 11;//单元损坏触发器列表
  repeated MIUnitDetectedEventTrigger unitDetectedEventTriggers = 12;//单元探测触发器列表
  repeated MIUnitEmissionsEventTrigger unitEmissionsEventTriggers = 13;//单元放射触发器列表
}

// LUA脚本条件信息
message MILuaScriptEventCondition{
