// 设置触发器随机时间请求
message RequestSetRandomTimeTrigger{
  string earliestTime = 1;//开始检查的最早日期/时间
  string latestTime = 2;//停止检查的最晚日期/时间
}

// 设置触发器固定时间请求
message RequestSetRegularTimeTrigger{
  string interval = 1;//间隔时间
}

// 设置触发器时间请求
message RequestSetTimeTrigger{
  string time = 1;//实际设置日期/时间
}

// 设置触发器目标信息请求
message RequestTargetTriggerInfo{
  string targetSide = 1;//目标阵营
  string targetType = 2;//目标类型（舰船、潜艇等）   参考EnumDefine.h内的LUA_EActiveUnitCategoryText定义
  optional string targetSubType = 3;//目标分类 单元类型下的子类型
  optional string specificUnitClass = 4;//单元级别（即唯一的 DBID）
  optional string specificUnitID = 5;//实际单元
  optional string weaponID = 6;//武器ID 单元损耗触发器ID
}

// 设置触发器单元被破坏请求
message RequestSetUnitDamagedTrigger{
  string damagePercent = 1;//单元损伤百分比
  RequestTargetTriggerInfo unitDamagedTarget = 2;//触发器目标信息
}

// 设置触发器单元被摧毁请求
message RequestSetUnitDestroyedTrigger{
  RequestTargetTriggerInfo unitDamagedTarget = 1;//触发器目标信息
}

// 设置触发器单元被探测请求
message RequestSetUnitDetectedTrigger{
  RequestTargetTriggerInfo unitDamagedTarget = 1;//触发器目标信息
  string detectorSideID = 2;//探测的推演方
  string MCL = 3;//最小分类级别
  repeated string area = 4;//设置触发器目标区域 参考点的名称
}

// 设置触发器单元进入区域请求
message RequestSetUnitEntersAreaTrigger{
  RequestTargetTriggerInfo unitDamagedTarget = 1;//触发器目标信息
  string earliestTime = 2;//最早到达日期/时间
  string latestTime = 3;//最晚到达日期/时间
  string notArea = 4;//不在区域内
  string exitArea = 5;//离开区域
  repeated string area = 6;//设置触发器目标区域 参考点的名称
  optional bool setExitArea = 7;//设置离开区域
}

// 设置触发器单元保留在区域内请求
message RequestSetUnitRemainsInAreaTrigger{
  RequestTargetTriggerInfo unitDamagedTarget = 1;//触发器目标信息
  string TD = 2;//区域内停留时间（秒数，或日数:时数:分数:秒数）
  repeated string area = 3;//设置触发器目标区域 参考点的名称
}

// 设置触发器单元保留在区域内请求
message RequestSetUnitBaseStatusTrigger{
  string targetStatus = 1;//目标状态
  string delayedSec = 2;//触发器延时 秒
}

// 设置触发器请求
message RequestSetTrigger {
  string mode = 1;//模式：添加(add)/删除(remove)/更新(update)
  string type = 2;//类型设置触发器类型 "Points", "RandomTime", "RegularTime", "ScenEnded", "ScenLoaded", "Time", "UnitDamaged", 
					        //"UnitDestroyed", "UnitDetected", "UnitEntersArea", "UnitRemainsInArea", "UnitBaseStatus", "unitexpend"(武器消耗)--和单元损耗（UnitDamaged）触发器一样
  string name = 3;//触发器名称
  optional string rename = 4;//触发器新名称（可选）
  // ... 其他字段根据type动态使用
  optional RequestSetPointsTrigger score = 5;//推演方得分触发器
  optional RequestSetRandomTimeTrigger randomTime = 6;//随机时间触发器
  optional RequestSetRegularTimeTrigger regularTime = 7;//固定时间触发器
  optional RequestSetTimeTrigger time = 8;//时间触发器
  optional RequestSetUnitDamagedTrigger unitDamaged = 9;//单元被破坏触发器
  optional RequestSetUnitDestroyedTrigger unitDestroyed = 10;//单元被摧毁触发器
  optional RequestSetUnitDetectedTrigger unitDetected = 11;//单元被探测触发器
  optional RequestSetUnitEntersAreaTrigger unitEntersArea = 12;//单元进入区域触发器
  optional RequestSetUnitRemainsInAreaTrigger unitRemainsInArea = 13;//单元保留在区域内触发器
  optional RequestSetUnitBaseStatusTrigger unitBaseStatus = 14;//单元基本状态触发器
  optional string ISTIDY = 15;//是否精简返回参数
}

// 设置改变任务状态动作请求
message RequestSetChangeMissionStatusAction{
  string sideId = 1;//推演方
  string missionID = 2;//任务ID
  string newStatus = 3;//新状态 激活:"0" 未激活:"1"
}

// 设置Lua脚本动作请求
message RequestSetLuaScriptAction{
  string scriptText = 1;//lua脚本内容
}

// 设置消息动作请求
message RequestSetMessageAction{
  string sideId = 1;//推演方
  string messageText = 2;//消息内容
}

// 设置得分动作请求
message RequestSetPointsAction{
  string sideId = 1;//推演方
  string pointChange = 2;//分数变化
}

// 设置转移到区域动作请求
message RequestSetTeleportInAreaAction{
  repeated string unitIDs = 1;//单元进入区域的所有单元ID
  repeated string area = 2;//转移到区域 参考点的名称
}

// 设置动作请求
message RequestSetAction {
  string mode = 1;//模式：添加(add)/删除(remove)/更新(update)
  string type = 2;//类型 改变任务状态："ChangeMissionStatus", 终止想定:"EndScenario", Lua脚本："LuaScript", 消息:"Message", 得分："Points", 转移到区域:"TeleportInArea"
  string name = 3;//动作名称
  optional string rename = 4;//新名称（可选）
  // ... 其他字段根据type动态使用
  optional RequestSetChangeMissionStatusAction changeMissionStatus = 5;//改变任务状态动作
  optional RequestSetLuaScriptAction luaScript = 6;//Lua脚本动作
  optional RequestSetMessageAction msg = 7;//消息动作
  optional RequestSetPointsAction points = 8;//得分动作
  optional RequestSetTeleportInAreaAction teleportInArea = 9;//转移到区域动作
  optional string ISTIDY = 10;//是否精简返回参数
}

// 设置事件请求
message RequestSetEvent {
  string name = 1;//事件名
  string mode = 2;//模式：添加(add)/删除(remove)/更新(update)
  optional string rename = 3;//事件新名称（可选）
  optional bool isActive = 4;//是否激活
  optional bool isRepeatable = 5;//是否可重复
  optional bool IsShown = 6;//显示在日志
  int32 probability = 7; //概率
  repeated string trigger = 8;//触发器列表描述或GUID
