  string type = 2;//类型 想定已经开始："ScenHasStarted", 阵营立场:"SidePosture", lua脚本："LuaScript"
  string name = 3;//条件名称
  optional string rename = 4;//新名称（可选）
  optional string NOT=5;//取反 'true'或'false' 在type值为"ScenHasStarted"/"SidePosture"需赋值
  // ... 其他字段根据type动态使用
  optional RequestSetSidePostureCondition sidePosture = 6;//阵营立场条件
  optional RequestSetLuaScriptCondition luaScript = 7;//Lua脚本条件
