// 设置武器使用规则请求
message RequestSetDoctrineWRA {
  string targetType = 1;//目标类型：side/mission/unit/group
  string targetId = 2;//目标ID
  string weaponId = 3;//武器数据库ID
  optional string side = 4;//推演方（可选）当目标类型为mission时需赋值
  MIDoctrineWRAInfo doctrineWRAInfo = 5;//设置武器使用规则信息
}

// 武器使用规则信息
message MIDoctrineWRAInfo{
  EWRA_WeaponTargetType targetTypeEnum = 1;//目标类型枚举
  optional string weaponQty = 2;//齐射武器数  继承：'inherit'、系统默认：'system'、 最大：'Max'或数字字符串  'none':禁用
  optional string shooterQty = 3;//齐射发射架数  继承：'inherit'、系统默认：'system'、 最大：'Max'或数字字符串
  optional string firingRange = 4;//自动开火距离 继承：'inherit'、系统默认：'system'、 最大：'Max'或数字字符串 不自动启用自动开火 none
  optional string selfDefenceRange = 5;//自动防御距离  继承：'inherit'、系统默认：'system'、 最大：'Max'或数字字符串
}

// 武器使用规则列表
message MIDoctrineWRAList {
  map<string, MIDoctrineWRAInfo> doctrineWRAInfos = 1;//武器使用规则（key-武器DBID/武器GUID  value-武器使用规则信息）
} 

// 获取武器使用规则请求
message RequestGetDoctrineWRA {
  string targetType = 1;//目标类型side/mission/unit/group
  string targetId = 2;//目标ID
  optional string side = 3;//推演方（可选）
  optional bool escort = 4;//获取护航任务条令时，必须赋值
}

// 设置电磁管控请求
message RequestSetEMCON {
  string category = 1;//类别：'Side', 'Mission', 'Group', 'Unit'
  string nameId = 2;//名称或ID
  string content = 3;//内容 ['Radar/Sonar/OECM=Active/Passive;' / 'Inherit']
}

// ====================== 航路点管理 ======================

// 设置航路点速度、高度请求
message RequestSetWaypoint{
  string guid = 1;//实体id
  string pointid = 2;//航路点guid
  optional string speed = 3;//实体速度  节
  optional string altitude = 4;//实体高度  米
}

// 设置航路点条令请求
message RequestSetWaypointDoctrine{
  string guid = 1;//实体id
  string pointid= 2;//航路点guid
  optional bool escort = 3;//是否护航
  MIDoctrineSettings doctrine = 4;//条令设置
}

// 设置航路点传感器请求
message RequestSetWaypointSensorSwitch{
  string guid = 1;//实体id
  string pointid = 2;//航路点guid
  string sensorid = 3;//传感器ID
  optional bool radar = 4;//开关雷达则赋值
  optional bool sonar = 5;//开关声呐则赋值
  optional bool OECM = 6;//开关电子干扰则赋值
}

// ====================== 天气环境消息 ======================

// 设置天气请求
message RequestSetWeather {
  int32 temperature = 1;//温度（摄氏度）当前基线温度（摄氏度），随纬度变化
  int32 rainfall = 2;//降水量  降水量，0-50.
  double cloudCover = 3;//云层覆盖度  云层覆盖度， 0.0-1.0
  double seaState = 4;//海况  当前海况， 0-9
}

// 获取天气请求
message RequestGetWeather {
  SimpleRequest request = 1;
}

// 天气信息
message MIWeather{
  optional int32 temperature = 1;//温度（摄氏度）
  optional int32 rainfall = 2;//降水量
  optional double cloudCover = 3;//云层覆盖度
  optional double seaState = 4;//海况
}

// 获取地形高程请求
message RequestGetElevation {
  string latitude = 1;// 纬度
  string longitude = 2;// 经度
}

// 设置电磁环境基准值请求
message RequestSetElectromagneticBase {
  double electromagneticComplexityBase = 1;// 电磁复杂度基准值
  double electromagneticEnergyBase = 2;// 电磁能量值基准值
}

// 设置电磁环境请求
message RequestSetElectromagnetic {
  double ElectromagneticComplexity = 1;// 电磁复杂度
  double ElectromagneticEnergy = 2;// 电磁能量
}

// ====================== 参考点管理消息 ======================

// 添加参考点请求
message RequestAddReferencePoint {
  string side = 1;//推演方
  string name = 2;//参考点名
  double longitude = 3;//经度 范围(-180,180) 如果大于180，则X-360，小于-180，则X+360
  double latitude = 4;//纬度 范围(-90,90) 如果大于90，则180-X，小于-90，则-180-X
  optional string guid = 5;//GUID（可选）
}

// 删除参考点请求
message RequestDeleteReferencePoint{
  string side = 1;//推演方
  RequestDelete deletePoints = 2;//参考点GUID
}

// 设置参考点请求
message RequestSetReferencePoint {
  string side = 1;//推演方
  string name = 2;//参考点名
  double longitude = 3;//经度
  double latitude = 4;//纬度
}

// 获取参考点请求
message RequestGetReferencePoints {
  string side = 1;//推演方
  repeated string area = 2;//参考点名列表
}

// 参考点信息
message MIReferencePointInfo{
  string side = 1;//推演方
  string name = 2;//参考点名
  double longitude = 3;//经度
  double latitude = 4;//纬度
  string guid = 5;//参考点GUID
  optional bool locked = 6;//锁定
  optional string bearingtype = 7;//轴承类型 0:Fixed 1:Rotating
  optional string relativeto = 8;//关联单元名字
}

// 参考点列表信息
message MIReferencePoints{
  repeated MIReferencePointInfo points = 1;//参考点列表
}

//选定参考点 固定轴或者旋转以及取消
message RequestSetAxisPoint{
  string unitid=1;//单元id
  string orientationtype=2;//设定轴心类型  0.取消 1.旋转 2.固定
  string referencenpoints=3;//多个参考点ID  用,区分
}

// ====================== 飞机行动消息 ======================

// 飞机行动基础信息
message AircraftActionBase {
  string side = 1;//推演方
  repeated string guids = 2;//飞机GUID列表
}

// 执行飞机单机行动请求
message RequestExecuteAircraftSingleAction {
  AircraftActionBase base = 1;
}

// 执行飞机编队行动请求
message RequestExecuteAircraftGroupAction {
  AircraftActionBase base = 1;
}

// 停止飞机行动请求
message RequestStopAircraftAction {
  AircraftActionBase base = 1;
}

// 准备飞机行动请求
message RequestPrepareAircraftAction {
  string unitName = 1;//实体GUID
  int64 loadoutID = 2;//挂载方案DBID
  int32 mode = 3;//模式 1:确认-出动准备 2:确认-出动准备(不含可选武器) 3:立即出动准备(想定编辑) 4:立即出动准备-忽略弹药库(想定编辑)
  int64 timeToReadyMinutes = 4;//载荷准备时间（分钟）
}

// 设置飞机准备时间请求
message RequestSetAircraftReadyTime {
  AircraftActionBase base = 1;
  int64 seconds = 2;//准备时间（秒）
}

// 设置飞机载荷请求
message RequestSetAircraftLoadout {
  string unitName = 1;//实体GUID
  int64 loadoutID = 2;//挂载方案DBID
  int64 timeToReadyMinutes = 3;//准备时间（分钟）
}

// ====================== 船舶行动消息 ======================

// 执行船舶单机行动请求
message RequestExecuteShipSingleAction {
  AircraftActionBase base = 1;
}

// 执行船舶编队行动请求
message RequestExecuteShipGroupAction {
  AircraftActionBase base = 1;
}

// 停止船舶行动请求
message RequestStopShipAction {
  AircraftActionBase base = 1;
}

// ====================== 情报与接触消息 ======================

// 获取情报接触请求
message RequestGetContact {
  string side = 1;//推演方名或ID
  string guid = 2;//目标情报单元GUID
}

// 获取推演方所有情报接触请求
message RequestGetSideContacts {
  string side = 1;//推演方名或ID
}

// 设置情报阵营请求
message RequestSetContactPosture {
  string side = 1;//推演方
  repeated string guidList = 2;//情报目标GUID列表
  string posture = 3;//阵营  中立："Neutral",友好："Friendly",不友好："Unfriendly",敌对："Hostile",未知："Unknown"
}

// 断开情报标识请求
message RequestDropContactTargets {
  string side = 1;//推演方
  repeated string guidList = 2;//情报目标GUID列表
}

// 标记情报单元位置请求
message RequestMarkContactPosition {
  string side = 1;//推演方
  string guid = 2;//情报目标GUID
  string newName = 3;//新名称
}

// 设置用户数据请求
message RequestSetContactUserData {
  string side = 1;//推演方
  string guid = 2;//情报目标GUID
  string newName = 3;//新名称
}

// ====================== 攻击与目标消息 ======================

// 攻击安排
message AttackArrange {
  int32 mode = 1;//攻击模式 0：自动攻击 1：手动攻击
  int32 mount = 2;//挂架DBID
  int32 weapon = 3;//武器DBID
  int32 qty = 4;//发射数量
  optional string latitude = 5;//目标纬度（纯方位攻击）
  optional string longitude = 6;//目标经度（纯方位攻击）
  repeated Waypoint course = 7;//导弹路径规划点
  repeated string guid = 8;//指定导弹的GUID
}

// 放弃特定目标请求
message RequestDropTarget {
  string side = 1;//推演方
  string unitId = 2;//实体GUID
  string targetId = 3;//目标GUID
}

// 放弃所有目标请求
message RequestDropAllTargets {
  string side = 1;//推演方
  string unitId = 2;//实体GUID
}

// 自动攻击目标请求
message RequestAttackContactAuto {
  string guid = 1;//实体GUID
  string target = 2;//目标GUID
  int32 mode = 3;//模式 0：自动攻击  1：手动攻击
}

// 手动攻击请求
message RequestAttackContactManual {
  string guid = 1;//实体GUID
  string target = 2;//目标GUID
  AttackArrange arrange = 3;//攻击安排
}

// 取消攻击请求
message RequestCancelAttackContact {
  string guid = 1;//攻击单元GUID
  string targetGuid = 2;//敌方GUID
  optional int32 mountID = 3;//挂架ID
  int32 weaponID = 4;//武器DBID
  optional int32 count = 5;//取消武器发射数量
}

// 设置攻击航线请求
message RequestSetAttackCourse {
  string attacker = 1;//攻击单元GUID
  string target = 2;//被攻击单元GUID
  int32 weaponDBID = 3;//武器DBID
  repeated Waypoint course = 4;//导弹航路（可选，不赋值则取消武器航路）
}

// 多单元自动攻击请求
message RequestAttackUnitsAuto {
  repeated RequestAttackContactAuto attackList = 1;//攻击列表
}

// 多单元手动攻击请求
message RequestAttackUnitsManual {
  repeated RequestAttackContactManual attackList = 1;//攻击列表
}

// 纯方位攻击请求
message RequestAttackBearing {
  string guid = 1;//实体GUID
  string target = 2;//纯方位攻击标志 "BOL"
  int32 mode = 3;//攻击模式
  int32 mount = 4;//挂架DBID
  int32 weapon = 5;//武器DBID
  int32 qty = 6;//发射数量
  string latitude = 7;//目标纬度
  string longitude = 8;//目标经度
  repeated Waypoint course = 9;//导弹路径规划点
  repeated string missileGuid = 10;//指定导弹的GUID
}

// ====================== 特殊武器与效果消息 ======================

// 箔条爆破请求
message RequestExecuteChaffBurst {
  string unitId = 1;//单元ID
  bool enabled = 2;//启用/禁用
  bool continuous = 3;//是否连续 false:单次爆破 true:连续爆破
}

// 创建爆炸请求
message RequestCreateExplosion {
  int32 warheadId = 1;//战斗部ID
  double latitude = 2;//纬度
  double longitude = 3;//经度
  double altitude = 4;//高度
  optional double radius = 5;//半径（可选）
}

// 部署声呐请求
message RequestDeploySonar {
  string guid = 1;//实体GUID
  string type = 2;//声呐类型 被动"PASSIVE"、主动"ACTIVE"、吊放"DIPPING"
  bool shallow = 3;//是否浅层
}

// ====================== 货物与装载消息 ======================

// 添加货物信息请求
