<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="228"
     viewBox="0 0 780 228" version="1.1"
     font-family="Noto Sans CJK SC" fill="#1f2937">
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arr-cycle" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 约束点 1：决策周期，横跨七段 ===== -->
  <text x="390" y="18" font-size="12" font-weight="600" fill="#3370ff"
        text-anchor="middle">一次决策周期 30 s：七段走一遍</text>
  <path d="M16,26 L764,26" stroke="#3370ff" stroke-width="1"/>
  <path d="M16,26 L16,34" stroke="#3370ff" stroke-width="1"/>
  <path d="M764,26 L764,34" stroke="#3370ff" stroke-width="1"/>

  <!-- ===== 约束点 2：指令配额，对齐 ③④ 两段 ===== -->
  <text x="336" y="40" font-size="12" font-weight="600" fill="#b3261e"
        text-anchor="middle">配额：任意 10 s ≤ 500 条（自设 400 条）</text>
  <path d="M232,48 L440,48" stroke="#b3261e" stroke-width="1"/>
  <path d="M232,48 L232,56" stroke="#b3261e" stroke-width="1"/>
  <path d="M440,48 L440,56" stroke="#b3261e" stroke-width="1"/>

  <!-- ===== 约束点 3：单条长度，对齐 ④ 动作 ===== -->
  <text x="390" y="62" font-size="12" font-weight="600" fill="#b3261e"
        text-anchor="middle">单条指令 ≤ 300 字符</text>
  <path d="M340,70 L440,70" stroke="#b3261e" stroke-width="1"/>
  <path d="M340,70 L340,78" stroke="#b3261e" stroke-width="1"/>
  <path d="M440,70 L440,78" stroke="#b3261e" stroke-width="1"/>

  <!-- ===== 判据一段是全图唯一随智能体而变的部分 ===== -->
  <text x="282" y="90" font-size="11.5" font-weight="600" fill="#c07a3a"
        text-anchor="middle">判据是唯一随智能体而变的一段</text>

  <!-- ===== 第 1 段：读态势 ===== -->
  <rect x="16" y="96" width="100" height="86" rx="6"
        fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="66" y="120" font-size="16" font-weight="600"
        text-anchor="middle">① 读态势</text>
  <text x="66" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">取本周期快照</text>

  <!-- ===== 第 2 段：归一化 / 选择器 ===== -->
  <rect x="124" y="96" width="100" height="86" rx="6"
        fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="174" y="120" font-size="16" font-weight="600"
        text-anchor="middle">② 选择器</text>
  <text x="174" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">先归一化名称</text>
  <text x="174" y="160" font-size="12.5" fill="#6b7280"
        text-anchor="middle">再按关键字选</text>

  <!-- ===== 第 3 段：判据（唯一因智能体而异） ===== -->
  <rect x="232" y="96" width="100" height="86" rx="6"
        fill="#fdf2e9" stroke="#c07a3a" stroke-width="1.8"/>
  <text x="282" y="120" font-size="16" font-weight="600"
        text-anchor="middle">③ 判据</text>
  <text x="282" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">距离 · 速度</text>
  <text x="282" y="160" font-size="12.5" fill="#6b7280"
        text-anchor="middle">与阈值比一次</text>

  <!-- ===== 第 4 段：动作 ===== -->
  <rect x="340" y="96" width="100" height="86" rx="6"
        fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="390" y="120" font-size="16" font-weight="600"
        text-anchor="middle">④ 动作</text>
  <text x="390" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">翻成离散指令</text>

  <!-- ===== 第 5 段：回读与记账 ===== -->
  <rect x="448" y="96" width="100" height="86" rx="6"
        fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="498" y="120" font-size="16" font-weight="600"
        text-anchor="middle">⑤ 回读记账</text>
  <text x="498" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">确认真的生效</text>

  <!-- ===== 第 6 段：日志 ===== -->
  <rect x="556" y="96" width="100" height="86" rx="6"
        fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.2"/>
  <text x="606" y="120" font-size="16" font-weight="600"
        text-anchor="middle">⑥ 日志</text>
  <text x="606" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">每周期记一行</text>

  <!-- ===== 第 7 段：CSV 快照 ===== -->
  <rect x="664" y="96" width="100" height="86" rx="6"
        fill="#f4f5f7" stroke="#7c8593" stroke-width="1.2"/>
  <text x="714" y="120" font-size="16" font-weight="600"
        text-anchor="middle">⑦ 快照</text>
  <text x="714" y="144" font-size="12.5" fill="#6b7280"
        text-anchor="middle">真源落盘备查</text>

  <!-- ===== 段与段之间的流水 ===== -->
  <path d="M117,139 L122,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>
  <path d="M225,139 L230,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>
  <path d="M333,139 L338,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>
  <path d="M441,139 L446,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>
  <path d="M549,139 L554,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>
  <path d="M657,139 L662,139" stroke="#4a6fa5" stroke-width="1.2"
        marker-end="url(#arr-flow)"/>

  <!-- ===== 周期回环 ===== -->
  <path d="M714,182 L714,200 L66,200 L66,182" stroke="#6b7280"
        stroke-width="1" stroke-dasharray="5,3" fill="none"
        marker-end="url(#arr-cycle)"/>
  <text x="390" y="218" font-size="11.5" fill="#6b7280"
        text-anchor="middle">下一个 30 s 决策周期：同一套七段再走一遍</text>
</svg>
