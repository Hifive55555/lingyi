<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620"
     viewBox="0 0 1400 620" version="1.1"
     font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ================= 栏标题 ================= -->
  <g text-anchor="middle">
    <text x="356" y="42" font-size="24" font-weight="600">地空导弹系统</text>
    <text x="356" y="70" font-size="18" fill="#6b6b6b">爱国者连 1/2 · 地空导弹连 · 霍克连</text>
    <text x="1044" y="42" font-size="24" font-weight="600">可机动雷达</text>
    <text x="1044" y="70" font-size="18" fill="#6b6b6b">沿海雷达 · 两部对空监视雷达</text>
  </g>

  <!-- ================= 栏底 ================= -->
  <g fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.6">
    <rect x="24" y="78" width="664" height="474" rx="14"/>
    <rect x="712" y="78" width="664" height="474" rx="14"/>
  </g>

  <!-- ================= 左栏：地空导弹系统 ================= -->
  <!-- 打击模式（雷达开 · 停车） -->
  <g>
    <rect x="190" y="96" width="340" height="150" rx="12"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="212" y="134" font-size="22" font-weight="600">打击模式</text>
    <text x="212" y="174" font-size="19">雷达：开（对空搜索）</text>
    <text x="212" y="202" font-size="19">油门：停车（FullStop）</text>
    <text x="212" y="230" font-size="19">阵位：驻守 · 对空自由开火</text>
  </g>
  <!-- 机动模式（雷达关 · 全速） -->
  <g>
    <rect x="190" y="372" width="340" height="150" rx="12"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="212" y="410" font-size="22" font-weight="600">机动模式</text>
    <text x="212" y="450" font-size="19">雷达：关</text>
    <text x="212" y="478" font-size="19">油门：全速（Flank）</text>
    <text x="212" y="506" font-size="19">阵位：向北 100 km</text>
    <text x="508" y="506" font-size="18" fill="#6b6b6b" text-anchor="end">霍克向正西</text>
    <rect x="418" y="386" width="92" height="30" rx="15"
          fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="464" y="407" font-size="18" fill="#6b6b6b" text-anchor="middle">开局默认</text>
  </g>
  <!-- 人的意图：两个方向各一条实线 -->
  <g stroke="#1a1a1a" stroke-width="2.2" fill="none">
    <line x1="210" y1="372" x2="210" y2="247" marker-end="url(#ah)"/>
    <line x1="510" y1="246" x2="510" y2="371" marker-end="url(#ah)"/>
  </g>
  <text x="222" y="266" font-size="20">操作手按钮</text>
  <text x="498" y="350" font-size="20" text-anchor="end">操作手按钮</text>
  <!-- 机器的安全自动：被瞄准 → 机动（单向 + 锁） -->
  <line x1="360" y1="246" x2="360" y2="318" stroke="#b3261e" stroke-width="2.4"
        stroke-dasharray="9 6"/>
  <text x="372" y="272" font-size="18" fill="#b3261e">被瞄准 ⇒</text>
  <text x="372" y="300" font-size="18" fill="#b3261e">自动切回机动</text>
  <g>
    <rect x="342" y="308" width="36" height="46" fill="#fbfbfb"/>
    <path d="M351,330 v-7 a9,9 0 0 1 18,0 v7" fill="none"
          stroke="#b3261e" stroke-width="3"/>
    <rect x="346" y="330" width="28" height="22" rx="4" fill="#b3261e"/>
    <circle cx="360" cy="341" r="3.2" fill="#fbfbfb"/>
    <path d="M352.5,354 L367.5,354 L360,371 z" fill="#b3261e"/>
  </g>

  <!-- ================= 右栏：可机动雷达 ================= -->
  <!-- 骗弹模式（雷达开 · 停车） -->
  <g>
    <rect x="878" y="96" width="340" height="150" rx="12"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="900" y="134" font-size="22" font-weight="600">骗弹模式</text>
    <text x="900" y="174" font-size="19">雷达：开（对外辐射）</text>
    <text x="900" y="202" font-size="19">油门：停车（FullStop）</text>
    <text x="900" y="230" font-size="19">阵位：驻守 · 勾反辐射弹</text>
    <rect x="1106" y="110" width="92" height="30" rx="15"
          fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="1152" y="131" font-size="18" fill="#6b6b6b" text-anchor="middle">开局默认</text>
  </g>
  <!-- 机动模式（雷达关 · 全速） -->
  <g>
    <rect x="878" y="372" width="340" height="150" rx="12"
          fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="900" y="410" font-size="22" font-weight="600">机动模式</text>
    <text x="900" y="450" font-size="19">雷达：关</text>
    <text x="900" y="478" font-size="19">油门：全速（Flank）</text>
    <text x="900" y="506" font-size="19">阵位：向南 100 km</text>
  </g>
  <!-- 人的意图：两个方向各一条实线 -->
  <g stroke="#1a1a1a" stroke-width="2.2" fill="none">
    <line x1="898" y1="372" x2="898" y2="247" marker-end="url(#ah)"/>
    <line x1="1198" y1="246" x2="1198" y2="371" marker-end="url(#ah)"/>
  </g>
  <text x="910" y="266" font-size="20">操作手按钮</text>
  <text x="1186" y="350" font-size="20" text-anchor="end">操作手按钮</text>
  <!-- 机器的安全自动：被瞄准 → 机动（单向 + 锁） -->
  <line x1="1048" y1="246" x2="1048" y2="318" stroke="#b3261e" stroke-width="2.4"
        stroke-dasharray="9 6"/>
  <text x="1060" y="272" font-size="18" fill="#b3261e">被瞄准 ⇒</text>
  <text x="1060" y="300" font-size="18" fill="#b3261e">自动切回机动</text>
  <g>
    <rect x="1030" y="308" width="36" height="46" fill="#fbfbfb"/>
    <path d="M1039,330 v-7 a9,9 0 0 1 18,0 v7" fill="none"
          stroke="#b3261e" stroke-width="3"/>
    <rect x="1034" y="330" width="28" height="22" rx="4" fill="#b3261e"/>
    <circle cx="1048" cy="341" r="3.2" fill="#fbfbfb"/>
    <path d="M1040.5,354 L1055.5,354 L1048,371 z" fill="#b3261e"/>
  </g>

  <!-- ================= 图例 ================= -->
  <g stroke-width="2.2" fill="none">
    <line x1="30" y1="574" x2="96" y2="574" stroke="#1a1a1a" marker-end="url(#ah)"/>
    <line x1="420" y1="574" x2="478" y2="574" stroke="#b3261e" stroke-width="2.4"
          stroke-dasharray="9 6" marker-end="url(#ahr)"/>
  </g>
  <g>
    <path d="M484,572 v-4 a6,6 0 0 1 12,0 v4" fill="none" stroke="#b3261e" stroke-width="2.2"/>
    <rect x="480" y="572" width="20" height="15" rx="3" fill="#b3261e"/>
    <circle cx="490" cy="579" r="2.2" fill="#fbfbfb"/>
  </g>
  <text x="112" y="581" font-size="19">实线：人的意图（操作手按钮）</text>
  <text x="512" y="581" font-size="19">红虚线 + 锁：机器的安全自动（被瞄准只单向回到机动）</text>
  <g>
    <rect x="1030" y="558" width="92" height="30" rx="15"
          fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="1076" y="579" font-size="18" fill="#6b6b6b" text-anchor="middle">开局默认</text>
  </g>
  <text x="1136" y="581" font-size="19">该栏开局所处的模式</text>
  <text x="30" y="612" font-size="18" fill="#6b6b6b">两个方向的实线都只能由操作手按按钮触发；被瞄准只让单元单向退回机动，恢复原模式仍需再按一次按钮。</text>
</svg>
