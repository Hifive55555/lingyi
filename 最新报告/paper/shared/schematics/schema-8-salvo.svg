<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"
     version="1.1" font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="sal-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.3,0.7 L9.7,5 L0.3,9.3 z" fill="#b3261e"/>
    </marker>
    <marker id="sal-ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.3,0.7 L9.7,5 L0.3,9.3 z" fill="#2f6f9f"/>
    </marker>
    <g id="missile">
      <rect x="-16" y="-4" width="28" height="8" rx="4" fill="#b3261e"/>
      <path d="M12,-4 L23,0 L12,4 Z" fill="#b3261e"/>
      <path d="M-16,-4 L-22,-8 L-10,-4 Z" fill="#b3261e"/>
      <path d="M-16,4 L-22,8 L-10,4 Z" fill="#b3261e"/>
    </g>
    <g id="cvn">
      <path d="M-92,24 L92,24 L70,-10 L-70,-10 Z" fill="#a8bfd0" stroke="#33556e" stroke-width="2"/>
      <rect x="-20" y="-32" width="36" height="22" rx="3" fill="#ffffff" stroke="#33556e" stroke-width="2"/>
      <g fill="#33556e">
        <path d="M-52,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
        <path d="M-16,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
        <path d="M20,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
      </g>
    </g>
    <g id="ffg">
      <path d="M-50,16 L50,16 L36,-8 L-36,-8 Z" fill="#a8bfd0" stroke="#33556e" stroke-width="2"/>
      <rect x="-11" y="-24" width="22" height="16" rx="3" fill="#ffffff" stroke="#33556e" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <rect x="26" y="66" width="1080" height="650" rx="14" fill="#f4f9fb" stroke="#dcdcdc" stroke-width="1.4"/>
  <text x="46" y="44" font-size="24" font-weight="600">开局战术齐射：从下方绕后，打航母与甲板上的飞机</text>
  <text x="46" y="690" font-size="16" fill="#6b6b6b">示意图，非等比例；只画几何关系，不含平台读数</text>

  <!-- 等边三角形辅助线 -->
  <g stroke="#9db3c4" stroke-width="1.5" stroke-dasharray="7 5" fill="none">
    <line x1="400" y1="350" x2="746" y2="150"/>
    <line x1="400" y1="350" x2="746" y2="550"/>
    <line x1="746" y1="150" x2="746" y2="550"/>
  </g>

  <!-- 拦截弧 -->
  <circle cx="746" cy="150" r="150" fill="#d64545" fill-opacity="0.05" stroke="#d64545" stroke-width="2" stroke-dasharray="9 6"/>
  <circle cx="746" cy="550" r="150" fill="#d64545" fill-opacity="0.05" stroke="#d64545" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="842" y="46" font-size="16" fill="#b3261e">中段拦截弧</text>
  <text x="842" y="674" font-size="16" fill="#b3261e">中段拦截弧</text>

  <!-- 编队 -->
  <g transform="translate(400,350)"><use href="#cvn"/></g>
  <text x="400" y="292" font-size="19" font-weight="600" text-anchor="middle">航母（甲板停 3 架）</text>
  <g transform="translate(746,150)"><use href="#ffg"/></g>
  <text x="752" y="194" font-size="18" text-anchor="middle">护卫舰 1</text>
  <g transform="translate(746,550)"><use href="#ffg"/></g>
  <text x="752" y="594" font-size="18" text-anchor="middle">护卫舰 2</text>
  <text x="936" y="356" font-size="16" fill="#6b6b6b">等边三角形</text>

  <!-- 发射阵位 -->
  <g transform="translate(640,680)"><use href="#ffg"/></g>
  <text x="640" y="724" font-size="18" font-weight="600" text-anchor="middle">2235 护卫舰（发射阵位）</text>

  <!-- 航路 -->
  <path d="M640,646 L300,630 L200,480 L360,376" fill="none" stroke="#b3261e" stroke-width="3" stroke-dasharray="12 7"/>
  <circle cx="300" cy="630" r="6" fill="#ffffff" stroke="#b3261e" stroke-width="2.4"/>
  <circle cx="150" cy="560" r="6" fill="#ffffff" stroke="#b3261e" stroke-width="2.4"/>
  <text x="314" y="660" font-size="17" fill="#b3261e">折点 1</text>
  <text x="136" y="594" font-size="17" fill="#b3261e" text-anchor="end">折点 2（绕到弧外）</text>

  <!-- 齐射 -->
  <g>
    <use href="#missile" transform="translate(244,477) rotate(-41)"/>
    <use href="#missile" transform="translate(254,469) rotate(-41)"/>
    <use href="#missile" transform="translate(264,460) rotate(-41)"/>
    <use href="#missile" transform="translate(274,451) rotate(-41)"/>
    <use href="#missile" transform="translate(284,443) rotate(-41)"/>
    <use href="#missile" transform="translate(294,434) rotate(-41)"/>
    <use href="#missile" transform="translate(304,425) rotate(-41)"/>
    <use href="#missile" transform="translate(314,417) rotate(-41)"/>
    <use href="#missile" transform="translate(323,408) rotate(-41)"/>
    <use href="#missile" transform="translate(333,399) rotate(-41)"/>
    <use href="#missile" transform="translate(343,391) rotate(-41)"/>
    <use href="#missile" transform="translate(353,382) rotate(-41)"/>
  </g>
  <text x="240" y="424" font-size="19" font-weight="600" fill="#b3261e">12 发锆石 · 高超音速 · 数量饱和</text>

  <!-- 末端拦截 -->
  <g stroke="#2f6f9f" stroke-width="2.4" fill="none">
    <path d="M706,180 L440,280" marker-end="url(#sal-ahb)"/>
    <path d="M706,520 L440,414" marker-end="url(#sal-ahb)"/>
  </g>
  <text x="686" y="216" font-size="16" fill="#2f6f9f" text-anchor="end">末端才拦</text>
  <text x="686" y="508" font-size="16" fill="#2f6f9f" text-anchor="end">末端才拦</text>

  <!-- 漏过去 -->
  <g>
    <line x1="330" y1="328" x2="260" y2="298" stroke="#b3261e" stroke-width="3" marker-end="url(#sal-ah)"/>
    <line x1="330" y1="350" x2="260" y2="320" stroke="#b3261e" stroke-width="3" marker-end="url(#sal-ah)"/>
    <line x1="330" y1="372" x2="260" y2="342" stroke="#b3261e" stroke-width="3" marker-end="url(#sal-ah)"/>
  </g>
  <text x="308" y="292" font-size="18" font-weight="600" fill="#b3261e" text-anchor="end">漏过去的几发</text>

  <!-- 右侧注记 -->
  <g>
    <rect x="1140" y="86" width="228" height="146" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1160" y="116" font-size="19" font-weight="600">① 编队几何</text>
    <text x="1160" y="146" font-size="17">航母与两舰成等边三角形</text>
    <text x="1160" y="172" font-size="17">两舰拦截弧只覆盖东侧</text>
    <text x="1160" y="198" font-size="17">西侧与后方是盲区</text>
  </g>
  <g>
    <rect x="1140" y="252" width="228" height="146" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1160" y="282" font-size="19" font-weight="600">② 绕后航路</text>
    <text x="1160" y="312" font-size="17">从下方出发，两次折向</text>
    <text x="1160" y="338" font-size="17">中段始终在拦截弧外</text>
    <text x="1160" y="364" font-size="17">从航母背后进入末端</text>
  </g>
  <g>
    <rect x="1140" y="418" width="228" height="176" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1160" y="448" font-size="19" font-weight="600">③ 为什么打得到</text>
    <text x="1160" y="478" font-size="17">末端才拦，弹已进入高速段</text>
    <text x="1160" y="504" font-size="17">12 发齐射，末端拦不完</text>
    <text x="1160" y="530" font-size="17">甲板上停着的飞机</text>
    <text x="1160" y="556" font-size="17">一并被摧毁</text>
  </g>
</svg>
