<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"
     version="1.1" font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#b3261e"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#2f6f9f"/>
    </marker>
    <!-- 单发锆石：全长 30，间距 36，沿航路末端直线等距排列 -->
    <g id="missile">
      <rect x="-9" y="-3.2" width="18" height="6.4" rx="3.2" fill="#b3261e"/>
      <path d="M9,-3.2 L16,0 L9,3.2 Z" fill="#b3261e"/>
      <path d="M-9,-3.2 L-14,-7 L-5,-3.2 Z" fill="#b3261e"/>
      <path d="M-9,3.2 L-14,7 L-5,3.2 Z" fill="#b3261e"/>
    </g>
    <g id="cvn">
      <path d="M-92,24 L92,24 L70,-10 L-70,-10 Z" fill="#a8bfd0" stroke="#33556e" stroke-width="2"/>
      <rect x="-20" y="-32" width="36" height="22" rx="3" fill="#ffffff" stroke="#33556e" stroke-width="2"/>
      <g fill="#33556e">
        <path d="M-52,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
        <path d="M-16,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
        <path d="M20,8 l9,-5 l9,5 l-3,3 l-6,-2 l-6,2 z"/>
      </g>
    </g>
    <g id="ffg">
      <path d="M-50,16 L50,16 L36,-8 L-36,-8 Z" fill="#a8bfd0" stroke="#33556e" stroke-width="2"/>
      <rect x="-11" y="-24" width="22" height="16" rx="3" fill="#ffffff" stroke="#33556e" stroke-width="2"/>
    </g>
    <path id="hit" d="M0,-13 L4,-5 L12,-8 L8,0 L13,5 L4,5 L2,13 L-2,5 L-11,8 L-6,0 L-12,-5 L-3,-5 Z"
          fill="#f2b31c" stroke="#b3261e" stroke-width="1.2"/>
  </defs>

  <rect width="1400" height="880" fill="#ffffff"/>
  <rect x="26" y="66" width="1044" height="790" rx="14" fill="#f4f9fb" stroke="#dcdcdc" stroke-width="1.4"/>
  <text x="46" y="46" font-size="25" font-weight="600">开局战术齐射：从下方绕后，打航母与甲板上的飞机</text>

  <!-- 等边三角形辅助线（三边各 380） -->
  <g stroke="#9db3c4" stroke-width="1.5" stroke-dasharray="7 5" fill="none">
    <line x1="520" y1="400" x2="849" y2="210"/>
    <line x1="520" y1="400" x2="849" y2="590"/>
    <line x1="849" y1="210" x2="849" y2="590"/>
  </g>
  <g stroke="#9db3c4" stroke-width="2">
    <line x1="682" y1="300.7" x2="687" y2="309.3"/>
    <line x1="687" y1="490.7" x2="682" y2="499.3"/>
    <line x1="844" y1="400" x2="854" y2="400"/>
  </g>
  <text x="862" y="398" font-size="17" fill="#5d7385">等边三角形</text>
  <text x="862" y="422" font-size="17" fill="#5d7385">三边等长</text>

  <!-- 两舰中段拦截弧：只朝东张开的扇面（±68°，半径 150） -->
  <path d="M849,210 L905.3,70.9 A150,150 0 0 1 905.3,349.1 Z"
        fill="#d64545" fill-opacity="0.07" stroke="#d64545" stroke-width="2" stroke-dasharray="9 6"/>
  <path d="M849,590 L905.3,450.9 A150,150 0 0 1 905.3,729.1 Z"
        fill="#d64545" fill-opacity="0.07" stroke="#d64545" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="912" y="268" font-size="17" fill="#b3261e">拦截弧</text>
  <text x="912" y="532" font-size="17" fill="#b3261e">拦截弧</text>

  <!-- 弧的西侧：红叉标盲区 -->
  <g stroke="#b3261e" stroke-width="2.8" stroke-linecap="round">
    <line x1="701" y1="199" x2="723" y2="221"/>
    <line x1="723" y1="199" x2="701" y2="221"/>
    <line x1="701" y1="579" x2="723" y2="601"/>
    <line x1="723" y1="579" x2="701" y2="601"/>
  </g>
  <text x="688" y="190" font-size="17" fill="#b3261e" text-anchor="end">中段无从拦截</text>
  <text x="688" y="570" font-size="17" fill="#b3261e" text-anchor="end">中段无从拦截</text>

  <!-- 编队 -->
  <g transform="translate(520,400)"><use href="#cvn"/></g>
  <text x="470" y="342" font-size="19" font-weight="600" text-anchor="middle">航母（甲板停 3 架飞机）</text>
  <g stroke="#b3261e" stroke-width="2.2" stroke-linecap="round">
    <line x1="469" y1="399" x2="485" y2="415"/><line x1="485" y1="399" x2="469" y2="415"/>
    <line x1="505" y1="399" x2="521" y2="415"/><line x1="521" y1="399" x2="505" y2="415"/>
    <line x1="541" y1="399" x2="557" y2="415"/><line x1="557" y1="399" x2="541" y2="415"/>
  </g>

  <g transform="translate(849,210)"><use href="#ffg"/></g>
  <text x="846" y="172" font-size="18" text-anchor="end">护卫舰 1</text>
  <g transform="translate(849,590)"><use href="#ffg"/></g>
  <text x="846" y="634" font-size="18" text-anchor="end">护卫舰 2</text>

  <!-- 发射阵位：2235 在编队南侧 -->
  <g transform="translate(700,780)"><use href="#ffg"/></g>
  <text x="700" y="822" font-size="18" font-weight="600" text-anchor="middle">2235 护卫舰（发射阵位）</text>

  <!-- 绕后航路：南侧出发，两次折向，从弧外绕到航母背后 -->
  <path d="M648,776 L390,790 L97,715" fill="none" stroke="#b3261e" stroke-width="2.8" stroke-dasharray="11 6"/>
  <path d="M97,715 L439,407" fill="none" stroke="#d98a86" stroke-width="1.6" stroke-dasharray="6 6"/>
  <circle cx="390" cy="790" r="6.5" fill="#ffffff" stroke="#b3261e" stroke-width="2.4"/>
  <circle cx="97" cy="715" r="6.5" fill="#ffffff" stroke="#b3261e" stroke-width="2.4"/>
  <text x="390" y="764" font-size="17" fill="#b3261e" text-anchor="middle">折点 1</text>
  <text x="58" y="752" font-size="17" fill="#b3261e">折点 2</text>

  <!-- 12 发齐射：沿末端直线等距排列 -->
  <g>
    <use href="#missile" transform="translate(132.8,682.7) rotate(-42)"/>
    <use href="#missile" transform="translate(159.6,658.6) rotate(-42)"/>
    <use href="#missile" transform="translate(186.3,634.5) rotate(-42)"/>
    <use href="#missile" transform="translate(213.1,610.4) rotate(-42)"/>
    <use href="#missile" transform="translate(239.8,586.3) rotate(-42)"/>
    <use href="#missile" transform="translate(266.6,562.2) rotate(-42)"/>
    <use href="#missile" transform="translate(293.3,538.1) rotate(-42)"/>
    <use href="#missile" transform="translate(320.1,514.1) rotate(-42)"/>
    <use href="#missile" transform="translate(346.9,490) rotate(-42)"/>
    <use href="#missile" transform="translate(373.6,465.9) rotate(-42)"/>
    <use href="#missile" transform="translate(400.4,441.8) rotate(-42)"/>
    <use href="#missile" transform="translate(427.1,417.7) rotate(-42)"/>
  </g>
  <use href="#hit" transform="translate(444,396) scale(0.95)"/>

  <text x="80" y="500" font-size="18" font-weight="600" fill="#b3261e">12 发锆石 · 高超音速</text>
  <text x="80" y="526" font-size="18" font-weight="600" fill="#b3261e">数量饱和，末端拦不完</text>

  <text x="250" y="396" font-size="18" font-weight="600" fill="#b3261e">从航母背后进入</text>
  <line x1="382" y1="393" x2="425" y2="401" stroke="#b3261e" stroke-width="1.3"/>

  <text x="452" y="462" font-size="17" font-weight="600" fill="#b3261e">漏过去几发命中</text>
  <text x="452" y="490" font-size="17" font-weight="600" fill="#b3261e">甲板 3 架被毁</text>

  <!-- 末端才拦：从护卫舰指向来袭弹流 -->
  <path d="M806,232 Q700,244 462,374" fill="none" stroke="#2f6f9f" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <path d="M806,566 Q700,548 356,511" fill="none" stroke="#2f6f9f" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <text x="640" y="244" font-size="17" fill="#2f6f9f">末端才拦</text>
  <text x="540" y="512" font-size="17" fill="#2f6f9f">末端才拦</text>

  <text x="46" y="836" font-size="17" fill="#6b6b6b">示意图，非等比例；只画几何关系，不含平台读数</text>

  <!-- 右侧注记 -->
  <g>
    <rect x="1096" y="96" width="282" height="140" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1116" y="128" font-size="19" font-weight="600">① 编队几何</text>
    <text x="1116" y="160" font-size="17">航母与两舰成等边三角形</text>
    <text x="1116" y="188" font-size="17">中段拦截弧只朝东</text>
    <text x="1116" y="216" font-size="17">西侧与背后是盲区</text>
  </g>
  <g>
    <rect x="1096" y="256" width="282" height="140" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1116" y="288" font-size="19" font-weight="600">② 绕后航路</text>
    <text x="1116" y="320" font-size="17">从下方出发，两次折向</text>
    <text x="1116" y="348" font-size="17">中段全程在拦截弧外</text>
    <text x="1116" y="376" font-size="17">从航母背后进入末端</text>
  </g>
  <g>
    <rect x="1096" y="416" width="282" height="160" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1116" y="448" font-size="19" font-weight="600">③ 为什么打得到</text>
    <text x="1116" y="480" font-size="17">末端才拦，弹已进高速段</text>
    <text x="1116" y="508" font-size="17">12 发齐射，末端拦不完</text>
    <text x="1116" y="536" font-size="17">漏过去的几发命中航母</text>
    <text x="1116" y="564" font-size="17">甲板上 3 架一并被毁</text>
  </g>
  <g>
    <rect x="1096" y="596" width="282" height="190" rx="12" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.4"/>
    <text x="1116" y="628" font-size="19" font-weight="600">图例</text>
    <line x1="1116" y1="664" x2="1160" y2="664" stroke="#b3261e" stroke-width="3" stroke-dasharray="12 7"/>
    <text x="1172" y="670" font-size="17">绕后航路（两次折向）</text>
    <path d="M1122,696 L1136,682 A16,16 0 0 1 1136,710 Z" fill="#d64545" fill-opacity="0.12"
          stroke="#d64545" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="1172" y="702" font-size="17">中段拦截弧（只朝东）</text>
    <line x1="1116" y1="728" x2="1160" y2="728" stroke="#2f6f9f" stroke-width="2.6" marker-end="url(#ah-blue)"/>
    <text x="1172" y="734" font-size="17">末端拦截（最后窗口）</text>
    <use href="#missile" transform="translate(1138,760)"/>
    <text x="1172" y="766" font-size="17">锆石齐射 ×12</text>
  </g>
</svg>
