<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"
     version="1.1" font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#d64545"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#4a90d9"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6.6" markerHeight="6.6" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#4a4a4a"/>
    </marker>
    <!-- 来袭弹（红，细长胶囊） -->
    <g id="msl">
      <path d="M8,-4.5 A4.5,4.5 0 0 1 8,4.5 L-24,4.5 L-30,0 L-24,-4.5 Z" fill="#d64545"/>
    </g>
    <!-- 我方飞机（蓝，俯视轮廓） -->
    <g id="ac">
      <path d="M20,0 L4,-4 L-2,-14 L-8,-14 L-4,-4 L-14,-4 L-16,-7 L-18,-7
               L-18,7 L-16,7 L-14,4 L-4,4 L-8,14 L-2,14 L4,4 Z" fill="#4a90d9"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ============ 图内小标题（左上角） ============ -->
  <text x="28" y="46" font-size="26" font-weight="600">最近接近点（CPA）：一枚弹到底指不指向我</text>
  <text x="28" y="76" font-size="18" fill="#6b6b6b">相对速度合成 → 垂足 → 三条门限，三条同时成立才算“指向本机”</text>

  <line x1="905" y1="96" x2="905" y2="556" stroke="#d5d5d5" stroke-width="1.4" stroke-dasharray="7 7"/>

  <!-- ==================================================================
       (a) 判定几何
       ================================================================== -->
  <text x="44" y="122" font-size="19" font-weight="600">（a）判定几何（把本机视作静止）</text>

  <!-- 相对航迹（虚线）  -->
  <line x1="660" y1="190" x2="150" y2="469" stroke="#4a4a4a" stroke-width="1.8"
        stroke-dasharray="8 6"/>
  <!-- 当前位置连线 r -->
  <line x1="660" y1="190" x2="280" y2="470" stroke="#6b6b6b" stroke-width="1.8"/>

  <!-- CPA 垂足  -->
  <line x1="280" y1="470" x2="250" y2="414" stroke="#d64545" stroke-width="2.6"/>
  <!-- 直角标记 -->
  <path d="M254.8,422.6 L246.0,427.4 L241.2,418.6" fill="none" stroke="#d64545" stroke-width="1.4"/>
  <circle cx="250" cy="414" r="4.5" fill="#d64545"/>

  <!-- 速度矢量  -->
  <line x1="644" y1="211" x2="508" y2="392" stroke="#d64545" stroke-width="2.6"
        marker-end="url(#ahr)"/>
  <line x1="300" y1="478" x2="411" y2="515" stroke="#4a90d9" stroke-width="2.6"
        marker-end="url(#ahb)"/>

  <!-- 飞行器图标  -->
  <circle cx="660" cy="190" r="15" fill="#ffffff"/>
  <use href="#msl" transform="translate(660,190) rotate(126.9)"/>
  <circle cx="280" cy="470" r="15" fill="#ffffff"/>
  <use href="#ac" transform="translate(280,470) rotate(18.7) scale(1.25)"/>

  <!-- 标注  -->
  <text x="490" y="362" font-size="21" fill="#4a4a4a">r</text>
  <text x="604" y="322" font-size="19" fill="#d64545">v_m</text>
  <text x="341" y="530" font-size="19" fill="#4a90d9" text-anchor="middle">v_a</text>
  <text x="470" y="250" font-size="18" fill="#4a4a4a" text-anchor="middle">未来航迹（相对）</text>
  <line x1="498" y1="257" x2="505" y2="272" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="250" y="392" font-size="20" font-weight="600" fill="#d64545" text-anchor="middle">CPA</text>
  <text x="44" y="566" font-size="18" fill="#6b6b6b">r：当前弹目距离　｜　虚线：本机静止后弹的相对航迹　｜　CPA 垂足即脱靶量　｜　示意，CPA 已放大</text>

  <!-- 速度合成插图  -->
  <rect x="44" y="152" width="330" height="190" rx="10"
        fill="#fbfafa" stroke="#d5d5d5" stroke-width="1.4"/>
  <text x="60" y="180" font-size="18" font-weight="600">相对速度合成</text>
  <text x="60" y="206" font-size="18" fill="#6b6b6b">v_rel = v_m − v_a</text>

  <line x1="200" y1="234" x2="126" y2="334" stroke="#d64545" stroke-width="2.2"
        marker-end="url(#ahr)"/>
  <line x1="200" y1="234" x2="268" y2="257" stroke="#4a90d9" stroke-width="2.2"
        marker-end="url(#ahb)"/>
  <line x1="268" y1="257" x2="126" y2="334" stroke="#4a4a4a" stroke-width="2.2"
        marker-end="url(#ahg)"/>
  <text x="98" y="324" font-size="18" fill="#d64545" text-anchor="end">v_m</text>
  <text x="284" y="264" font-size="18" fill="#4a90d9">v_a</text>
  <text x="196" y="332" font-size="18" fill="#4a4a4a" text-anchor="middle">v_rel</text>

  <!-- ==================================================================
       (b) 三条判据
       ================================================================== -->
  <text x="932" y="122" font-size="19" font-weight="600">（b）三条判据：全部成立才报“有弹”</text>

  <!-- 判据 1 -->
  <text x="932" y="180" font-size="20" font-weight="600">① 弹目距离 &lt; 90 km</text>
  <text x="932" y="206" font-size="18" fill="#6b6b6b">90 km 以外不看，省掉无谓的配对</text>
  <rect x="940" y="220" width="200" height="28" fill="#fdf6e3"/>
  <rect x="940" y="220" width="400" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="1140" y1="212" x2="1140" y2="256" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1040" y="240" font-size="18" text-anchor="middle">关心</text>
  <text x="1240" y="240" font-size="18" fill="#6b6b6b" text-anchor="middle">不关心</text>
  <text x="1140" y="276" font-size="18" fill="#d64545" text-anchor="middle">90 km</text>

  <!-- 判据 2 -->
  <text x="932" y="300" font-size="20" font-weight="600">② 最近接近点 CPA &lt; 3 km</text>
  <text x="932" y="326" font-size="18" fill="#6b6b6b">垂足距离即脱靶量，小于 3 km 才算打得上</text>
  <rect x="940" y="340" width="200" height="28" fill="#fdf6e3"/>
  <rect x="940" y="340" width="400" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="1140" y1="332" x2="1140" y2="376" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1040" y="360" font-size="18" text-anchor="middle">算指向我</text>
  <text x="1240" y="360" font-size="18" fill="#6b6b6b" text-anchor="middle">不算</text>
  <text x="1140" y="396" font-size="18" fill="#d64545" text-anchor="middle">3 km</text>

  <!-- 判据 3 -->
  <text x="932" y="420" font-size="20" font-weight="600">③ 预计命中时间 &lt; 900 s</text>
  <text x="932" y="446" font-size="18" fill="#6b6b6b">按当前接近率外推的剩余飞行时间</text>
  <rect x="940" y="460" width="200" height="28" fill="#fdf6e3"/>
  <rect x="940" y="460" width="400" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="1140" y1="452" x2="1140" y2="496" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1040" y="480" font-size="18" text-anchor="middle">算指向我</text>
  <text x="1240" y="480" font-size="18" fill="#6b6b6b" text-anchor="middle">不算</text>
  <text x="1140" y="516" font-size="18" fill="#d64545" text-anchor="middle">900 s</text>

  <text x="932" y="554" font-size="19" font-weight="600">三条同时成立 → 输出四元组，否则视为无威胁</text>

  <!-- ============ 图例（右下角） ============ -->
  <use href="#msl" transform="translate(966,588) scale(0.72)"/>
  <text x="998" y="594" font-size="18">来袭弹</text>
  <use href="#ac" transform="translate(1090,588) scale(0.72)"/>
  <text x="1112" y="594" font-size="18">本机</text>
  <line x1="1176" y1="588" x2="1226" y2="588" stroke="#4a4a4a" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="1236" y="594" font-size="18">相对航迹</text>
  <line x1="1322" y1="580" x2="1322" y2="596" stroke="#d64545" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1336" y="594" font-size="18">门限</text>
</svg>
