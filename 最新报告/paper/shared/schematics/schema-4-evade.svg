<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"
     version="1.1" font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#d64545"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#4a90d9"/>
    </marker>
    <!-- 来袭弹（红，细长胶囊） -->
    <g id="msl">
      <path d="M8,-4.5 A4.5,4.5 0 0 1 8,4.5 L-24,4.5 L-30,0 L-24,-4.5 Z" fill="#d64545"/>
    </g>
    <!-- 我方飞机（蓝，俯视轮廓） -->
    <g id="ac">
      <path d="M20,0 L4,-4 L-2,-14 L-8,-14 L-4,-4 L-14,-4 L-16,-7 L-18,-7
               L-18,7 L-16,7 L-14,4 L-4,4 L-8,14 L-2,14 L4,4 Z" fill="#4a90d9"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ============ 图内小标题（左上角） ============ -->
  <text x="28" y="46" font-size="26" font-weight="600">空战单元自卫：门限从哪来、往哪转、什么时候才动</text>
  <text x="28" y="76" font-size="18" fill="#6b6b6b">门限取 1.2d₀，硬兜底 25 km；机动取正横；实际触发被 30 s 周期拖到门限内侧</text>

  <line x1="472" y1="96" x2="472" y2="556" stroke="#d5d5d5" stroke-width="1.4" stroke-dasharray="7 7"/>
  <line x1="940" y1="96" x2="940" y2="556" stroke="#d5d5d5" stroke-width="1.4" stroke-dasharray="7 7"/>

  <!-- ==================================================================
       (a) 威胁锥与门限圈
       ================================================================== -->
  <text x="44" y="122" font-size="19" font-weight="600">（a）威胁锥与门限圈</text>
  <text x="44" y="150" font-size="18" fill="#6b6b6b">圆心是本机；进锥且进圈，规则才动</text>

  <!-- 外圈：1.2 d0 -->
  <circle cx="215" cy="350" r="135" fill="none" stroke="#4a90d9" stroke-width="2"
          stroke-dasharray="9 7"/>
  <text x="215" y="200" font-size="19" fill="#4a90d9" text-anchor="middle">1.2d₀ 门限</text>

  <!-- 内圈：25 km 硬兜底 -->
  <circle cx="215" cy="350" r="58" fill="#fdf6e3" stroke="#4a90d9" stroke-width="1.8"
          stroke-dasharray="6 5"/>
  <text x="215" y="437" font-size="19" fill="#4a90d9" text-anchor="middle">25 km 硬兜底</text>

  <!-- 威胁锥 -->
  <path d="M215,350 L321,198 A185,185 0 0 1 394,302 Z"
        fill="#d64545" fill-opacity="0.10" stroke="#d64545" stroke-width="1.4"
        stroke-dasharray="6 5"/>
  <line x1="405" y1="218" x2="215" y2="350" stroke="#b9b9b9" stroke-width="1.2"
        stroke-dasharray="5 5"/>
  <text x="425" y="325" font-size="18" fill="#a33c3c" text-anchor="middle">威胁锥</text>
  <line x1="412" y1="316" x2="396" y2="303" stroke="#a33c3c" stroke-width="1.2"/>

  <!-- 来袭弹与其速度矢量 -->
  <line x1="377" y1="248" x2="319" y2="288" stroke="#d64545" stroke-width="2.6"
        marker-end="url(#ahr)"/>
  <use href="#msl" transform="translate(376,238) rotate(145.2)"/>
  <text x="400" y="208" font-size="18" fill="#d64545" text-anchor="end">来袭弹</text>

  <!-- 本机 -->
  <circle cx="215" cy="350" r="15" fill="#ffffff"/>
  <use href="#ac" transform="translate(215,350) rotate(180) scale(1.25)"/>

  <text x="215" y="520" font-size="18" text-anchor="middle">进圈才动：跨过 1.2d₀ 才开始规避</text>

  <!-- ==================================================================
       (b) 正横脱离
       ================================================================== -->
  <text x="500" y="122" font-size="19" font-weight="600">（b）正横脱离</text>
  <text x="500" y="150" font-size="18" fill="#6b6b6b">新航向 ⊥ 弹速矢量；横向分离换来脱靶量</text>

  <!-- 弹的未来航迹 -->
  <line x1="740" y1="273" x2="560" y2="377" stroke="#d64545" stroke-width="1.8"
        stroke-dasharray="8 6"/>
  <!-- 弹速矢量 -->
  <line x1="840" y1="215" x2="744" y2="270" stroke="#d64545" stroke-width="2.6"
        marker-end="url(#ahr)"/>
  <use href="#msl" transform="translate(840,215) rotate(150)"/>
  <text x="806" y="288" font-size="19" fill="#d64545">v_m 弹速</text>
  <text x="700" y="352" font-size="18" fill="#a33c3c" text-anchor="middle">弹的未来航迹</text>

  <!-- 脱靶量：本机到弹航迹的垂距 -->
  <line x1="567" y1="373" x2="600" y2="430" stroke="#d64545" stroke-width="2.6"/>
  <circle cx="567" cy="373" r="4.5" fill="#d64545"/>
  <text x="556" y="418" font-size="19" fill="#d64545" text-anchor="end">脱靶量</text>
  <line x1="562" y1="413" x2="584" y2="404" stroke="#d64545" stroke-width="1.2"/>

  <!-- 本机与新航向 -->
  <circle cx="600" cy="430" r="15" fill="#ffffff"/>
  <use href="#ac" transform="translate(600,430) rotate(60) scale(1.25)"/>
  <line x1="614" y1="454" x2="660" y2="534" stroke="#4a90d9" stroke-width="2.8"
        marker-end="url(#ahb)"/>
  <text x="660" y="462" font-size="18" fill="#4a90d9">新航向（⊥ 弹速）</text>
  <!-- 90 度角标 -->
  <path d="M574,445 L589,471 L615,456" fill="none" stroke="#4a90d9" stroke-width="1.6"/>
  <text x="556" y="452" font-size="19" fill="#4a90d9" text-anchor="end">90°</text>

  <!-- ==================================================================
       (c) 采样量化
       ================================================================== -->
  <text x="970" y="122" font-size="19" font-weight="600">（c）采样量化：门限在两次决策之间被跨过</text>
  <text x="970" y="150" font-size="18" fill="#6b6b6b">每 30 s 决策一次，弹一个周期接近 13 km</text>

  <!-- 接近轴 -->
  <line x1="980" y1="340" x2="1330" y2="340" stroke="#6b6b6b" stroke-width="1.8"
        marker-end="url(#ah)"/>

  <!-- 门限 -->
  <line x1="1150" y1="250" x2="1150" y2="370" stroke="#4a90d9" stroke-width="2"
        stroke-dasharray="9 7"/>
  <text x="1136" y="262" font-size="19" fill="#4a90d9" text-anchor="end">门限 1.2d₀</text>

  <!-- 三个周期位置 -->
  <use href="#msl" transform="translate(1100,340)"/>
  <use href="#msl" transform="translate(1190,340)"/>
  <use href="#msl" transform="translate(1290,340)"/>
  <g font-size="18" text-anchor="middle">
    <text x="1100" y="392">本周期</text>
    <text x="1186" y="392">下个周期</text>
    <text x="1304" y="392">再过 13 km</text>
  </g>

  <!-- 实触发点 -->
  <text x="1250" y="292" font-size="18" fill="#4a4a4a" text-anchor="middle">实触发点</text>
  <text x="1250" y="316" font-size="18" fill="#4a4a4a" text-anchor="middle">落在门限内侧</text>
  <line x1="1198" y1="322" x2="1190" y2="333" stroke="#4a4a4a" stroke-width="1.4"/>

  <!-- 本机 -->
  <circle cx="1360" cy="340" r="15" fill="#ffffff"/>
  <use href="#ac" transform="translate(1360,340) rotate(180) scale(1.25)"/>

  <!-- ============ 图例（右下角） ============ -->
  <use href="#msl" transform="translate(920,588) scale(0.72)"/>
  <text x="950" y="594" font-size="18">来袭弹</text>
  <use href="#ac" transform="translate(1040,588) scale(0.8)"/>
  <text x="1062" y="594" font-size="18">本机</text>
  <circle cx="1140" cy="588" r="9" fill="none" stroke="#4a90d9" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="1158" y="594" font-size="18">门限圈</text>
  <rect x="1240" y="578" width="26" height="20" rx="4" fill="#fdf6e3" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="1276" y="594" font-size="18">硬兜底区</text>
</svg>
