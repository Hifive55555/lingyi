  <text x="78" y="866" font-size="18" fill="#6b6b6b" text-anchor="middle">来袭弹</text>
  <use href="#burst1" xlink:href="#burst1" transform="translate(122,895)"/>
  <use href="#burst1" xlink:href="#burst1" transform="translate(442,895)"/>
  <line x1="238" y1="940" x2="136" y2="903" stroke="#b3261e" stroke-width="2.4"
