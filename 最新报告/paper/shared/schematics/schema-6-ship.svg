  <line x1="505" y1="940" x2="455" y2="903" stroke="#2f6f9f" stroke-width="2.4"
        marker-end="url(#ahb1)"/>
  <text x="160" y="878" font-size="18" fill="#b3261e" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">D<tspan dy="4" font-size="13">max</tspan><tspan dy="-4"> 开火</tspan></text>
  <text x="462" y="850" font-size="18" fill="#2f6f9f" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">½D<tspan dy="4" font-size="13">max</tspan><tspan dy="-4"> 补射</tspan></text>

  <!-- 两段拦截距离：只画段长差异 -->
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="110" y1="1035" x2="270" y2="1035"/>
    <line x1="110" y1="1027" x2="110" y2="1043"/>
    <line x1="270" y1="1027" x2="270" y2="1043"/>
  </g>
  <text x="286" y="1042" font-size="18">远界先拦 · 段长 D<tspan dy="4" font-size="13">max</tspan></text>
  <g stroke="#2f6f9f" stroke-width="2">
    <line x1="110" y1="1075" x2="220" y2="1075"/>
    <line x1="110" y1="1067" x2="110" y2="1083"/>
    <line x1="220" y1="1067" x2="220" y2="1083"/>
  </g>
  <text x="236" y="1082" font-size="18" fill="#2f6f9f">半程补拦 · 段长 ½D<tspan dy="4" font-size="13">max</tspan></text>

  <!-- ============================================================ -->
  <!-- 面板 c                                                        -->
  <!-- ============================================================ -->
  <rect x="710" y="740" width="670" height="380" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.4"/>
  <text x="730" y="780" font-size="21" font-weight="600">c　第三类软杀伤：打断照射链</text>
  <rect x="730" y="802" width="630" height="298" rx="10" fill="#f4f8fb"/>

  <!-- 敌照射机与波束 -->
  <path d="M1230,865 L1070.2,806.9 L1065.8,824.6 L1063.0,843.0 L1062.0,861.6 L1063.0,880.2 L1065.8,898.6 L1070.2,916.3 L1076.9,933.4 L1085.8,949.5 L1096.7,964.4 L1109.5,977.7 L1124.0,989.3 L1140.0,998.8 L1157.1,1006.2 L1175.0,1011.9 L1193.5,1015.5 L1212.4,1016.9 L1230,1015.8 Z"
        fill="#b0720a" fill-opacity="0.10" stroke="#b0720a" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g transform="translate(1230,865) rotate(180)">
    <use href="#air1" xlink:href="#air1" transform="scale(1.15)"/>
  </g>
  <text x="1230" y="824" font-size="18" fill="#6b6b6b" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">敌照射机</text>

  <!-- 158C 与照射线 -->
  <use href="#missile1" xlink:href="#missile1" transform="translate(1065,865) rotate(149.4) scale(1.05)"/>
  <text x="1018" y="832" font-size="18" fill="#6b6b6b" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">158C</text>
  <line x1="1034" y1="840" x2="1054" y2="858" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="1196" y1="865" x2="1088" y2="865" stroke="#b0720a" stroke-width="2.6" stroke-dasharray="8 5"/>
  <g stroke="#b3261e" stroke-width="4">
    <line x1="1128" y1="851" x2="1152" y2="879"/>
    <line x1="1152" y1="851" x2="1128" y2="879"/>
  </g>
  <text x="1140" y="912" font-size="19" fill="#b3261e" font-weight="600" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">照射中断</text>

  <!-- 弹失效 -->
  <path d="M1045,880 Q930,930 820,1008" fill="none" stroke="#8a8a8a" stroke-width="2"
        stroke-dasharray="8 6"/>
  <g opacity="0.5">
    <use href="#missile1" xlink:href="#missile1" transform="translate(950,935) rotate(149.4) scale(0.95)"/>
  </g>
  <text x="900" y="900" font-size="18" fill="#6b6b6b" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">弹失效</text>
  <line x1="918" y1="908" x2="942" y2="926" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- 我方舰与苏-57 -->
  <use href="#lpd1" xlink:href="#lpd1" transform="translate(800,1022) scale(0.78) rotate(-18)"/>
  <text x="800" y="1076" font-size="18" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">23900 舰</text>
  <g transform="translate(1048,1026) rotate(-28)">
    <use href="#air1" xlink:href="#air1" transform="scale(1.05)"/>
  </g>
  <path d="M1090,1008 Q1160,950 1204,898" fill="none" stroke="#1a1a1a" stroke-width="2.6"
        marker-end="url(#ah1)"/>
  <text x="1050" y="1080" font-size="18" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">苏-57 驱离</text>

  <!-- ============================================================ -->
  <!-- 图例                                                          -->
  <!-- ============================================================ -->
  <g stroke-width="3" fill="none">
    <line x1="54" y1="1146" x2="118" y2="1146" stroke="#2f6f9f" marker-end="url(#ahb1)"/>
    <line x1="382" y1="1146" x2="446" y2="1146" stroke="#b3261e" marker-end="url(#ahr1)"/>
    <line x1="760" y1="1146" x2="824" y2="1146" stroke="#b0720a" marker-end="url(#aha1)"/>
  </g>
  <text x="132" y="1153" font-size="18">第一类：卢卡斯无人机</text>
  <text x="460" y="1153" font-size="18">第二类：海马斯 / 反舰导弹排</text>
  <text x="838" y="1153" font-size="18">第三类：158C / 154C</text>
  <g stroke="#b3261e" stroke-width="3.4">
    <line x1="1136" y1="1136" x2="1158" y2="1158"/>
    <line x1="1158" y1="1136" x2="1136" y2="1158"/>
  </g>
  <text x="1172" y="1153" font-size="18">照射中断 / 弹失效</text>

  <text x="1368" y="1180" font-size="18" fill="#6b6b6b" text-anchor="end">示意图，非等比例；箭头只表达来向，不代表真实航路</text>
</svg>
