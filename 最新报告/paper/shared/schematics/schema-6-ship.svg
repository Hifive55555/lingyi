<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="1190" viewBox="0 0 1400 1190" version="1.1"
     font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahb1" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#2f6f9f"/>
    </marker>
    <marker id="ahr1" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#b3261e"/>
    </marker>
    <marker id="aha1" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#b0720a"/>
    </marker>
    <g id="frigate1">
      <path d="M0,-56 L17,-24 L18,34 L0,52 L-18,34 L-17,-24 Z"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
      <rect x="-11" y="-16" width="22" height="34" rx="3"
            fill="#dcdcdc" stroke="#1a1a1a" stroke-width="1.6"/>
      <rect x="-15" y="-5" width="30" height="12" rx="2"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
      <line x1="0" y1="-6" x2="0" y2="-36" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="-10" y1="-34" x2="10" y2="-34" stroke="#1a1a1a" stroke-width="2.4"/>
    </g>
    <g id="lpd1">
      <path d="M-32,-62 L32,-62 L38,44 L0,62 L-38,44 Z"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
      <rect x="-22" y="-46" width="44" height="30" rx="3"
