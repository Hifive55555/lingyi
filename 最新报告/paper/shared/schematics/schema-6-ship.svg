  <rect x="0" y="0" width="1400" height="1190" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- 面板 a                                                        -->
  <!-- ============================================================ -->
  <text x="40" y="100" font-size="23" font-weight="600">a　三类威胁的来向与舰上三层拦截弧</text>
  <rect x="20" y="60" width="1360" height="640" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.4"/>
  <rect x="40" y="120" width="1320" height="560" rx="10" fill="#f4f8fb"/>
  <path d="M40,120 L230,120 L206,190 L250,260 L204,330 L244,400 L196,470 L236,540 L192,610 L232,680 L40,680 Z"
        fill="#f1efe8" stroke="#9a958a" stroke-width="1.8"/>
  <text x="74" y="645" font-size="18" fill="#6b6b6b">海岸</text>

  <!-- 三层同心弧 -->
  <circle cx="755" cy="430" r="236" fill="#ece9df" fill-opacity="0.55"
          stroke="#8a8a8a" stroke-width="2.2" stroke-dasharray="11 7"/>
  <circle cx="755" cy="430" r="150" fill="#e6eff6" fill-opacity="0.9"
          stroke="#2f6f9f" stroke-width="2.2" stroke-dasharray="9 6"/>
  <circle cx="755" cy="430" r="62" fill="#f8e6e4" fill-opacity="0.95"
          stroke="#b3261e" stroke-width="2.2" stroke-dasharray="7 5"/>

  <!-- 岸上发射阵位 -->
  <g>
    <rect x="202" y="305" width="34" height="34" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="219" y1="305" x2="219" y2="289" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="219" cy="286" r="3.2" fill="#1a1a1a"/>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6">
      <rect x="196" y="352" width="52" height="20" rx="3"/>
      <rect x="258" y="352" width="52" height="20" rx="3"/>
    </g>
    <g stroke="#1a1a1a" stroke-width="2.2">
      <line x1="202" y1="348" x2="212" y2="331"/>
      <line x1="214" y1="348" x2="224" y2="331"/>
      <line x1="226" y1="348" x2="236" y2="331"/>
      <line x1="264" y1="348" x2="274" y2="331"/>
      <line x1="276" y1="348" x2="286" y2="331"/>
      <line x1="288" y1="348" x2="298" y2="331"/>
    </g>
  </g>
  <text x="255" y="402" font-size="18" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">海马斯 / 反舰导弹排</text>

  <!-- 空中威胁 -->
  <g transform="translate(600,260) rotate(28)">
    <use href="#air1" xlink:href="#air1"/>
  </g>
  <g transform="translate(705,220) rotate(28)">
    <use href="#air1" xlink:href="#air1"/>
  </g>
  <g transform="translate(455,275) rotate(28)">
    <use href="#uav1" xlink:href="#uav1"/>
  </g>
  <g transform="translate(510,242) rotate(28)">
    <use href="#uav1" xlink:href="#uav1"/>
  </g>

  <!-- 三条来向箭头 -->
  <path d="M315,365 Q470,432 610,424" fill="none" stroke="#b3261e" stroke-width="3.2"
        marker-end="url(#ahr1)"/>
  <path d="M500,282 Q600,360 700,404" fill="none" stroke="#2f6f9f" stroke-width="3.2"
        marker-end="url(#ahb1)"/>
  <path d="M790,285 Q806,340 796,392" fill="none" stroke="#b0720a" stroke-width="3.2"
        marker-end="url(#aha1)"/>

  <text x="330" y="332" font-size="20" fill="#b3261e" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">第二类 · 海马斯 / 反舰导弹排</text>
  <text x="420" y="196" font-size="20" fill="#2f6f9f" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">第一类 · 卢卡斯无人机</text>
  <text x="800" y="182" font-size="20" fill="#b0720a" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">第三类 · 158C / 154C</text>
  <line x1="798" y1="196" x2="720" y2="222" stroke="#b0720a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="640" y1="206" x2="516" y2="250" stroke="#2f6f9f" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- 我方登陆编队 -->
  <use href="#frigate1" xlink:href="#frigate1" transform="translate(730,330) scale(0.9)"/>
  <use href="#frigate1" xlink:href="#frigate1" transform="translate(835,430) scale(0.9)"/>
  <use href="#lpd1" xlink:href="#lpd1" transform="translate(665,480)"/>
  <text x="730" y="272" font-size="18" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">雷鸣号 1</text>
  <text x="876" y="410" font-size="18" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">雷鸣号 2</text>
  <text x="665" y="570" font-size="18" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">23900 舰</text>

  <!-- 弧上标注 -->
  <text x="968" y="292" font-size="20" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">D<tspan dy="5" font-size="15">max</tspan><tspan dy="-5"> 最大拦截距离</tspan></text>
  <text x="896" y="362" font-size="20" fill="#2f6f9f" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">½D<tspan dy="5" font-size="15">max</tspan></text>
  <text x="826" y="486" font-size="19" fill="#b3261e" font-weight="600" paint-order="stroke"
        stroke="#ffffff" stroke-width="7" stroke-linejoin="round">3 km 自卫线</text>

  <!-- ============================================================ -->
  <!-- 面板 b                                                        -->
  <!-- ============================================================ -->
  <rect x="20" y="740" width="670" height="380" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.4"/>
  <text x="40" y="780" font-size="21" font-weight="600">b　分层补射：远界先拦 / 半程补拦</text>
  <rect x="40" y="802" width="630" height="298" rx="10" fill="#f4f8fb"/>

