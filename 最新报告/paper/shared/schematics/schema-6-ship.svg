      <rect x="-14" y="-8" width="28" height="44" rx="3"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="0" y1="-46" x2="0" y2="-70" stroke="#1a1a1a" stroke-width="2"/>
      <line x1="-12" y1="-68" x2="12" y2="-68" stroke="#1a1a1a" stroke-width="2.4"/>
    </g>
    <g id="air1">
      <path d="M-22,-7 L2,-4 L24,0 L2,4 L-22,7 L-12,0 Z"
            fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
      <path d="M-6,0 L-16,-18 L-6,-14 Z" fill="#1a1a1a"/>
      <path d="M-6,0 L-16,18 L-6,14 Z" fill="#1a1a1a"/>
      <path d="M-16,-2 L-26,-6 L-18,4 Z" fill="#1a1a1a"/>
    </g>
    <g id="uav1">
      <path d="M-10,-5 L10,0 L-10,5 L-4,0 Z" fill="#2f6f9f"/>
      <line x1="-4" y1="-12" x2="-4" y2="12" stroke="#2f6f9f" stroke-width="2.4"/>
      <circle cx="-4" cy="0" r="2.6" fill="#ffffff"/>
    </g>
    <g id="missile1">
      <rect x="-17" y="-5" width="32" height="10" rx="5" fill="#b3261e"/>
      <path d="M15,-5 L29,0 L15,5 Z" fill="#b3261e"/>
      <path d="M-17,-5 L-25,-11 L-12,-5 Z" fill="#b3261e"/>
      <path d="M-17,5 L-25,11 L-12,5 Z" fill="#b3261e"/>
