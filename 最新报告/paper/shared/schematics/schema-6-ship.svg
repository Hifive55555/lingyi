  <path d="M415,965 A105,105 0 0 1 625,965" fill="#e6eff6" fill-opacity="0.8"
        stroke="#2f6f9f" stroke-width="2" stroke-dasharray="8 5"/>
  <use href="#frigate1" xlink:href="#frigate1" transform="translate(255,965) scale(0.72)"/>
  <use href="#frigate1" xlink:href="#frigate1" transform="translate(520,965) scale(0.72)"/>
  <text x="200" y="948" font-size="18" text-anchor="end">一号舰</text>
  <text x="575" y="948" font-size="18">二号舰</text>
  <text x="255" y="848" font-size="19" text-anchor="middle" paint-order="stroke"
        stroke="#ffffff" stroke-width="6" stroke-linejoin="round">D<tspan dy="4" font-size="14">max</tspan></text>

  <!-- 来袭弹与两个拦截点 -->
  <line x1="55" y1="895" x2="640" y2="895" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="7 5"/>
