<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"
     version="1.1" font-family="Noto Sans CJK SC, sans-serif" fill="#1a1a1a">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6.4" markerHeight="6.4" orient="auto">
      <path d="M0.4,0.8 L9.6,5 L0.4,9.2 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>

  <!-- ============ 图内小标题（左上角） ============ -->
  <text x="28" y="46" font-size="26" font-weight="600">物理作战域三维监控：在框架里的位置与内部判定流水线</text>
  <text x="28" y="76" font-size="18" fill="#6b6b6b">唯一直接读内核的单位，也是唯一不产生动作的智能体</text>

  <!-- 左右分栏虚线 -->
  <line x1="612" y1="96" x2="612" y2="556" stroke="#d5d5d5" stroke-width="1.4" stroke-dasharray="7 7"/>

  <!-- ==================================================================
       (a) 左栏：在框架里的位置
       ================================================================== -->
  <text x="40" y="122" font-size="19" font-weight="600">（a）在框架里的位置</text>
  <text x="40" y="150" font-size="18" fill="#6b6b6b">只读观测、无动作输出；全量态势写进真源，四路只读</text>

  <!-- 平台内核 -->
  <rect x="150" y="168" width="300" height="58" rx="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="300" y="205" font-size="21" text-anchor="middle">平台内核（仿真）</text>

  <!-- 内核 → 监控 -->
  <line x1="300" y1="226" x2="300" y2="254" stroke="#1a1a1a" stroke-width="2"
        marker-end="url(#ah)"/>
  <text x="314" y="246" font-size="18">每步观测</text>

  <!-- 监控 -->
  <rect x="150" y="258" width="300" height="120" rx="10"
        fill="#fdf6e3" stroke="#1a1a1a" stroke-width="2.2"/>
  <text x="300" y="289" font-size="21" font-weight="600" text-anchor="middle">监控智能体（只读）</text>
  <text x="300" y="316" font-size="18" text-anchor="middle" fill="#4a4a4a">每步枚举敌方弹药</text>
  <rect x="212" y="327" width="176" height="32" rx="16"
        fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="300" y="349" font-size="18" text-anchor="middle" fill="#4a4a4a">无动作输出</text>

  <!-- 监控 → 态势真源 -->
  <line x1="300" y1="378" x2="300" y2="406" stroke="#1a1a1a" stroke-width="2"
        marker-end="url(#ah)"/>
  <text x="314" y="398" font-size="18">写入真源</text>

  <!-- 态势真源 -->
  <rect x="150" y="410" width="300" height="58" rx="10"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="300" y="447" font-size="21" text-anchor="middle">态势真源（全量态势）</text>

  <!-- 真源 → 三路只读 -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none">
    <line x1="300" y1="468" x2="300" y2="482"/>
    <line x1="114" y1="482" x2="480" y2="482"/>
    <line x1="114" y1="482" x2="114" y2="494" marker-end="url(#ah)"/>
    <line x1="293" y1="482" x2="293" y2="494" marker-end="url(#ah)"/>
    <line x1="480" y1="482" x2="480" y2="494" marker-end="url(#ah)"/>
  </g>

  <rect x="44" y="496" width="140" height="58" rx="9"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="114" y="532" font-size="18" text-anchor="middle">四个决策域</text>
  <rect x="218" y="496" width="150" height="58" rx="9"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="293" y="532" font-size="18" text-anchor="middle">人类视图（小窗）</text>
  <rect x="400" y="496" width="160" height="58" rx="9"
        fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="480" y="532" font-size="18" text-anchor="middle">pi_tap 采样</text>

  <!-- ==================================================================
       (b) 右栏：内部判定流水线
       ================================================================== -->
  <text x="632" y="122" font-size="19" font-weight="600">（b）内部结构：一条判定流水线</text>
  <text x="632" y="150" font-size="18" fill="#6b6b6b">每 30 s 从零重算，无状态；每一级都只做一次过滤</text>

  <!-- 级号 -->
  <g font-size="18" fill="#6b6b6b" text-anchor="middle">
    <text x="690" y="230">①</text>
    <text x="846" y="230">②</text>
    <text x="1002" y="230">③</text>
    <text x="1158" y="230">④</text>
    <text x="1314" y="230">⑤</text>
  </g>

  <!-- 五级方框 -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8">
    <rect x="632" y="240" width="116" height="76" rx="9"/>
    <rect x="788" y="240" width="116" height="76" rx="9"/>
    <rect x="944" y="240" width="116" height="76" rx="9"/>
    <rect x="1100" y="240" width="116" height="76" rx="9"/>
    <rect x="1256" y="240" width="116" height="76" rx="9" fill="#fdf6e3"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="690" y="287">情报枚举</text>
    <text x="846" y="287">弹目配对</text>
    <text x="1002" y="287">CPA 判定</text>
    <text x="1158" y="287">归并三路</text>
    <text x="1314" y="287">输出四元组</text>
  </g>

  <!-- 级间箭头 -->
  <g stroke="#1a1a1a" stroke-width="1.8">
    <line x1="748" y1="278" x2="782" y2="278" marker-end="url(#ah)"/>
    <line x1="904" y1="278" x2="938" y2="278" marker-end="url(#ah)"/>
    <line x1="1060" y1="278" x2="1094" y2="278" marker-end="url(#ah)"/>
    <line x1="1216" y1="278" x2="1250" y2="278" marker-end="url(#ah)"/>
  </g>

  <!-- 级下注解 -->
  <g font-size="18" fill="#6b6b6b" text-anchor="middle">
    <text x="690" y="344">敌方弹药清单</text>
    <text x="846" y="344">每弹 × 每单位</text>
    <text x="1002" y="344">最近接近 &lt; 3 km</text>
    <text x="1158" y="344">空 / 海 / 陆</text>
    <text x="1314" y="344">弹型 弹速</text>
    <text x="1314" y="370">距离 预计命中</text>
  </g>
  <text x="1314" y="396" font-size="18" fill="#d64545" text-anchor="middle">四个标量</text>

  <!-- 说明带 -->
  <rect x="632" y="416" width="740" height="100" rx="10"
        fill="#fdf6e3" stroke="#e3d7b2" stroke-width="1.4"/>
  <text x="656" y="452" font-size="19">· 无状态：每 30 s 从零重算，不依赖上一步的判定结果</text>
  <text x="656" y="488" font-size="19">· 窄接口：下游只拿四个标量，航向与 CPA 须自己按几何重算</text>

  <!-- ============ 图例（右下角） ============ -->
  <g>
    <line x1="900" y1="581" x2="940" y2="581" stroke="#1a1a1a" stroke-width="1.8"
          marker-end="url(#ah)"/>
    <text x="950" y="588" font-size="18">数据流</text>

    <rect x="1040" y="569" width="34" height="24" rx="5"
          fill="#fdf6e3" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="1084" y="588" font-size="18">强调节点</text>

    <rect x="1196" y="571" width="36" height="20" rx="10"
          fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.4"/>
    <text x="1242" y="588" font-size="18">只读 · 无动作</text>
  </g>
</svg>
